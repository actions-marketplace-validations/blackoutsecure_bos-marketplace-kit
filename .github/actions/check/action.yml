name: Marketplace pre-publish check
description: >-
  Validate a repository is ready to be published as a GitHub
  Marketplace Action.

  Part of the `bos-marketplace-kit` toolkit. Runs a suite of static
  checks against the current working tree and emits a markdown report
  to the job summary. Designed to run on every PR against the source
  branch (typically `dev`) so problems surface before the next promote.

  Check families:
    * MP### — Marketplace REQUIRED rules. Failures block publishing.
    * OP### — Operational best-practices. Failures are warnings by
      default; flip `fail_on_warning` to `true` to make them blocking.
    * SC### — Security hygiene. Failures block by default.

  Most metadata checks are delegated to `actionlint` (pinned by SHA),
  which carries an up-to-date allowlist of Feather icons + branding
  colours. Kit-specific checks (LICENSE / README presence, name
  validity, workflow-on-default detection) are layered on top.

  Pure git + bash + python3 + actionlint. No GitHub API calls.

inputs:
  action_yml_path:
    description: >-
      Path to the action manifest to lint. Default `action.yml` at
      the repo root.
    required: false
    default: 'action.yml'
  fail_on_warning:
    description: >-
      `true` to treat OP### warnings as failures (non-zero exit). MP###
      and SC### always fail. Default `false`.
    required: false
    default: 'false'
  skip_checks:
    description: >-
      Comma-separated list of check IDs to skip (e.g.
      `OP003,SC002`). Useful when migrating an existing repo into
      compliance gradually.
    required: false
    default: ''
  actionlint_version:
    description: >-
      Version tag of actionlint to install. Pinned to a known-good
      release; override only with care.
    required: false
    default: 'v1.7.7'
  actionlint_sha256:
    description: >-
      SHA-256 of the `linux_amd64` tarball for `actionlint_version`.
      Validated against the downloaded blob when the runner is x86_64.
      Defaults pinned for `v1.7.7`. Override in lockstep with
      `actionlint_version` when bumping.
    required: false
    default: '023070a287cd8cccd71515fedc843f1985bf96c436b7effaecce67290e7e0757'
  actionlint_sha256_arm64:
    description: >-
      SHA-256 of the `linux_arm64` tarball for `actionlint_version`.
      Validated when the runner reports `aarch64`/`arm64`. Required
      for self-hosted ARM64 runners (e.g. Raspberry Pi 4/5, Apple
      silicon, GitHub-hosted `*-arm` runners). Defaults pinned for
      `v1.7.7`.
    required: false
    default: '401942f9c24ed71e4fe71b76c7d638f66d8633575c4016efd2977ce7c28317d0'
  actionlint_sha256_armv6:
    description: >-
      SHA-256 of the `linux_armv6` tarball for `actionlint_version`.
      Validated when the runner reports `armv6l` or `armv7l`
      (actionlint does not ship a separate armv7 build — armv6 is
      forward-compatible to armv7). Defaults pinned for `v1.7.7`.
    required: false
    default: '82e98d7252341b83fa557764824f225fa50431801b8e3d8e99f70dc1efc317b2'
  actionlint_sha256_386:
    description: >-
      SHA-256 of the `linux_386` tarball for `actionlint_version`.
      Validated when the runner reports `i386`/`i686`. Defaults pinned
      for `v1.7.7`.
    required: false
    default: '01d4c173f411aeecf670d5219c008e07bf11539cf1181fdeee0cdb0eb8244aac'
  workflow_dir:
    description: >-
      Directory of workflow files to lint with actionlint, if any
      exist on this branch. Set to '' to skip workflow linting.
      Default `.github/workflows`.
    required: false
    default: '.github/workflows'

  # ----- Community-health (CH###) options ----------------------------------
  # Each `require_*` input takes one of:
  #   * `fail` -- missing the file is a hard failure.
  #   * `warn` -- missing the file produces a warning (default for the
  #     policy files that public Marketplace listings benefit from).
  #   * `skip` -- never check this file (acts the same as listing the
  #     rule in `skip_checks`).
  # The check action looks in this repo first, then -- if
  # `check_org_health` is true and `github_token` is non-empty -- in
  # the org's `.github` repository (canonical home for shared
  # community-health defaults).
  github_token:
    description: >-
      Token used for the org `.github` repo lookup. Pass the
      calling workflow's `github.token` (the built-in `GITHUB_TOKEN`
      is sufficient). If empty, the org-health lookup is skipped
      and CH/SC rules fall back to local-only detection, applying
      their `require_*` policy on missing files.
    required: false
    default: ''
  org_health_repo:
    description: >-
      `owner/.github` repository that holds the org's shared
      community-health defaults. Defaults to
      `<github.repository_owner>/.github` when the calling workflow
      does not override.
    required: false
    default: ''
  check_org_health:
    description: >-
      `true` to consult the org `.github` repo for community-health
      files. `false` to check only the current repo. Default `true`.
    required: false
    default: 'true'
  require_security:
    description: 'Policy for SECURITY.md (SC003). One of `fail`, `warn`, `skip`. Default `warn`.'
    required: false
    default: 'warn'
  require_code_of_conduct:
    description: 'Policy for CODE_OF_CONDUCT.md (CH001). One of `fail`, `warn`, `skip`. Default `warn`.'
    required: false
    default: 'warn'
  require_contributing:
    description: 'Policy for CONTRIBUTING.md (CH002). One of `fail`, `warn`, `skip`. Default `warn`.'
    required: false
    default: 'warn'
  require_support:
    description: 'Policy for SUPPORT.md (CH003). One of `fail`, `warn`, `skip`. Default `skip`.'
    required: false
    default: 'skip'
  require_issue_templates:
    description: 'Policy for issue templates (CH004). One of `fail`, `warn`, `skip`. Default `skip`.'
    required: false
    default: 'skip'
  require_pr_template:
    description: 'Policy for PR template (CH005). One of `fail`, `warn`, `skip`. Default `skip`.'
    required: false
    default: 'skip'
  require_funding:
    description: 'Policy for FUNDING.yml (CH006). One of `fail`, `warn`, `skip`. Default `skip`.'
    required: false
    default: 'skip'

  # ----- CH###/SC### source mode (where the file is expected to live) -----
  # Per-rule source-of-truth selector. Lets callers express *where*
  # each community-health file is expected to live:
  #   * `local`   -- file must be in this repo. Org fallback is
  #                  disabled for this rule.
  #   * `inherit` -- file is expected at `${org_health_repo}`. The
  #                  local copy is intentionally absent and is NOT
  #                  consulted. Use this mode when you've moved the
  #                  file to your org's `.github` repo for reuse.
  #   * `either`  -- check local first, fall back to org (the
  #                  historical default).
  # `community_health_source` is the global default applied to every
  # CH/SC rule. The per-rule overrides take precedence when non-empty.
  community_health_source:
    description: >-
      Default source for community-health files: `local`, `inherit`,
      or `either`. `inherit` expects the file at `${org_health_repo}`
      and treats a missing local copy as fine. `local` requires the
      file in this repo (org fallback disabled). `either` (default)
      checks local first, then falls back to the org repo.
    required: false
    default: 'either'
  security_source:
    description: >-
      Per-rule source for SECURITY.md (SC003). One of `local`,
      `inherit`, `either`, or empty (use `community_health_source`).
    required: false
    default: ''
  code_of_conduct_source:
    description: >-
      Per-rule source for CODE_OF_CONDUCT.md (CH001). One of `local`,
      `inherit`, `either`, or empty (use `community_health_source`).
    required: false
    default: ''
  contributing_source:
    description: >-
      Per-rule source for CONTRIBUTING.md (CH002). One of `local`,
      `inherit`, `either`, or empty (use `community_health_source`).
    required: false
    default: ''
  support_source:
    description: >-
      Per-rule source for SUPPORT.md (CH003). One of `local`,
      `inherit`, `either`, or empty (use `community_health_source`).
    required: false
    default: ''
  issue_templates_source:
    description: >-
      Per-rule source for issue templates (CH004). One of `local`,
      `inherit`, `either`, or empty (use `community_health_source`).
    required: false
    default: ''
  pr_template_source:
    description: >-
      Per-rule source for PR template (CH005). One of `local`,
      `inherit`, `either`, or empty (use `community_health_source`).
    required: false
    default: ''
  funding_source:
    description: >-
      Per-rule source for FUNDING.yml (CH006). One of `local`,
      `inherit`, `either`, or empty (use `community_health_source`).
    required: false
    default: ''

  # ----- AI auto-generation (FUTURE / NOT YET IMPLEMENTED) ----------------
  auto_generate_missing:
    description: >-
      [FUTURE / NOT YET IMPLEMENTED] When `true`, draft missing
      community-health files at workflow time using a configured LLM
      and open a PR against this repo (or `org_health_repo` for
      `inherit`-mode rules) so they stay up to date as policy guidance
      evolves. Currently a stub: setting `true` emits a one-time
      warning and otherwise has no effect. The input is declared now
      so callers can opt in once the implementation lands.
    required: false
    default: 'false'

  # ----- DP/CQ/LT/GH/MS/SR rule policies ----------------------------------
  # Same `fail|warn|skip` semantics as the CH/SC rules above.
  # Defaults are chosen to be back-compat: new rules default to `warn`
  # (visible but not blocking) so adding the kit to an existing repo
  # doesn't break its CI on the first run.

  require_dependabot:
    description: 'Policy for `.github/dependabot.yml` presence (DP001). One of `fail`, `warn`, `skip`. Default `warn`.'
    required: false
    default: 'warn'
  require_codeql:
    description: 'Policy for a CodeQL workflow (CQ001). One of `fail`, `warn`, `skip`. Default `warn`.'
    required: false
    default: 'warn'
  require_editorconfig:
    description: 'Policy for `.editorconfig` presence (LT001). One of `fail`, `warn`, `skip`. Default `warn`.'
    required: false
    default: 'warn'
  require_gitattributes:
    description: 'Policy for `.gitattributes` presence (LT002). One of `fail`, `warn`, `skip`. Default `warn`.'
    required: false
    default: 'warn'
  require_gitignore:
    description: 'Policy for `.gitignore` presence (LT003). One of `fail`, `warn`, `skip`. Default `warn`.'
    required: false
    default: 'warn'
  require_markdownlint:
    description: 'Policy for `.markdownlint.yaml`/`.markdownlint-cli2.yaml` presence (LT004). One of `fail`, `warn`, `skip`. Default `skip`.'
    required: false
    default: 'skip'
  require_yamllint:
    description: 'Policy for `.yamllint.yml`/`.yamllint.yaml` presence (LT005). One of `fail`, `warn`, `skip`. Default `skip`.'
    required: false
    default: 'skip'
  require_ghas_code_scanning:
    description: >-
      Policy for "Code scanning" being enabled at the repo level
      (GH001). One of `fail`, `warn`, `skip`. Requires `github_token`
      with `metadata: read`. Default `warn`. CodeQL is free on public
      repos — leave this at `warn` or higher to catch the listing
      drifting out of compliance.
    required: false
    default: 'warn'
  require_ghas_secret_scanning:
    description: >-
      Policy for "Secret scanning" being enabled at the repo level
      (GH002). Requires `github_token`. Default `warn`. Free on public
      repos. Set `skip` for private repos without GHAS licensing.
    required: false
    default: 'warn'
  require_dependabot_alerts:
    description: >-
      Policy for "Dependabot alerts" being enabled at the repo level
      (GH003). Requires `github_token` with `Administration: read`
      (the alerts endpoint is admin-scoped). Default `warn`.
    required: false
    default: 'warn'
  require_security_devops:
    description: >-
      Policy for the Microsoft Security DevOps workflow being present
      (MS001). One of `fail`, `warn`, `skip`. Default `skip` — opt in
      when your repo ships IaC or container images that benefit from
      Trivy/Checkov/Terrascan via the
      `microsoft/security-devops-action` wrapper.
    required: false
    default: 'skip'
  require_scorecard:
    description: >-
      Policy for the OpenSSF Scorecard workflow being present (SR001).
      One of `fail`, `warn`, `skip`. Default `skip` — opt in when you
      want your repo scored at https://scorecard.dev. Free for public
      repos; produces a SARIF report uploaded to GHAS.
    required: false
    default: 'skip'

outputs:
  passed:
    description: 'Number of checks that passed.'
    value: ${{ steps.run.outputs.passed }}
  failed:
    description: 'Number of checks that failed.'
    value: ${{ steps.run.outputs.failed }}
  warnings:
    description: 'Number of OP-family warnings.'
    value: ${{ steps.run.outputs.warnings }}
  report:
    description: >-
      Newline-separated `id|status|message` rows for every check that
      ran. Machine-readable.
    value: ${{ steps.run.outputs.report }}

runs:
  using: composite
  steps:
    - id: install
      shell: bash
      env:
        AL_VERSION:        ${{ inputs.actionlint_version }}
        AL_SHA256_AMD64:   ${{ inputs.actionlint_sha256 }}
        AL_SHA256_ARM64:   ${{ inputs.actionlint_sha256_arm64 }}
        AL_SHA256_ARMV6:   ${{ inputs.actionlint_sha256_armv6 }}
        AL_SHA256_386:     ${{ inputs.actionlint_sha256_386 }}
      run: |
        set -euo pipefail
        # Install actionlint into a scratch dir on PATH for this job.
        AL_DIR="${RUNNER_TEMP:-/tmp}/marketplace-kit-actionlint"
        mkdir -p "${AL_DIR}"

        # Detect runner arch and map to actionlint's release-asset
        # naming. The previous implementation hard-coded `linux_amd64`,
        # which silently downloaded the wrong-arch tarball on ARM
        # self-hosted runners -- SHA verification passed (we were
        # checking the amd64 SHA against an amd64 tarball), then the
        # binary failed at exec time with the cryptic
        #   `cannot execute binary file: Exec format error`
        # We now select the asset + per-arch SHA based on `uname -m`.
        UNAME_M="$(uname -m)"
        case "${UNAME_M}" in
          x86_64|amd64)
            AL_ASSET='linux_amd64'
            AL_SHA256="${AL_SHA256_AMD64}"
            ;;
          aarch64|arm64)
            AL_ASSET='linux_arm64'
            AL_SHA256="${AL_SHA256_ARM64}"
            ;;
          armv7l|armv6l)
            # actionlint v1.7.7 only ships armv6 (no separate armv7) --
            # armv6 binaries are forward-compatible to armv7 hardware.
            AL_ASSET='linux_armv6'
            AL_SHA256="${AL_SHA256_ARMV6}"
            ;;
          i386|i686)
            AL_ASSET='linux_386'
            AL_SHA256="${AL_SHA256_386}"
            ;;
          *)
            echo "::error::unsupported runner architecture '${UNAME_M}'; actionlint provides linux_{amd64,arm64,armv6,386} only" >&2
            exit 1
            ;;
        esac

        # Strip leading 'v' for the tarball filename.
        VER="${AL_VERSION#v}"
        URL="https://github.com/rhysd/actionlint/releases/download/${AL_VERSION}/actionlint_${VER}_${AL_ASSET}.tar.gz"
        TARBALL="${AL_DIR}/actionlint.tar.gz"

        echo "Downloading ${URL}..."
        curl -fsSL --retry 3 --retry-delay 2 -o "${TARBALL}" "${URL}"

        if [[ -n "${AL_SHA256}" ]]; then
          echo "${AL_SHA256}  ${TARBALL}" | sha256sum -c -
        else
          # Empty SHA for a non-amd64 arch means the caller overrode
          # the version but didn't supply the matching per-arch SHA.
          # Refuse to silently skip verification.
          echo "::error::actionlint_sha256_<arch> for '${UNAME_M}' (-> ${AL_ASSET}) is empty; refusing to install unverified binary. Supply the SHA-256 of actionlint_${VER}_${AL_ASSET}.tar.gz via the matching input." >&2
          exit 1
        fi

        tar -C "${AL_DIR}" -xzf "${TARBALL}" actionlint
        chmod +x "${AL_DIR}/actionlint"

        echo "${AL_DIR}" >> "${GITHUB_PATH}"
        "${AL_DIR}/actionlint" --version

    - id: run
      shell: bash
      env:
        ACTION_YML_PATH:     ${{ inputs.action_yml_path }}
        FAIL_ON_WARN:        ${{ inputs.fail_on_warning }}
        SKIP_CHECKS:         ${{ inputs.skip_checks }}
        WORKFLOW_DIR:        ${{ inputs.workflow_dir }}
        GH_TOKEN:            ${{ inputs.github_token }}
        ORG_HEALTH_REPO_IN:  ${{ inputs.org_health_repo }}
        REPO_OWNER:          ${{ github.repository_owner }}
        CHECK_ORG_HEALTH:    ${{ inputs.check_org_health }}
        REQ_SECURITY:        ${{ inputs.require_security }}
        REQ_CODE_OF_CONDUCT: ${{ inputs.require_code_of_conduct }}
        REQ_CONTRIBUTING:    ${{ inputs.require_contributing }}
        REQ_SUPPORT:         ${{ inputs.require_support }}
        REQ_ISSUE_TEMPLATES: ${{ inputs.require_issue_templates }}
        REQ_PR_TEMPLATE:     ${{ inputs.require_pr_template }}
        REQ_FUNDING:         ${{ inputs.require_funding }}
        CH_SOURCE_DEFAULT:   ${{ inputs.community_health_source }}
        SRC_SECURITY:        ${{ inputs.security_source }}
        SRC_CODE_OF_CONDUCT: ${{ inputs.code_of_conduct_source }}
        SRC_CONTRIBUTING:    ${{ inputs.contributing_source }}
        SRC_SUPPORT:         ${{ inputs.support_source }}
        SRC_ISSUE_TEMPLATES: ${{ inputs.issue_templates_source }}
        SRC_PR_TEMPLATE:     ${{ inputs.pr_template_source }}
        SRC_FUNDING:         ${{ inputs.funding_source }}
        AUTO_GENERATE_MISSING: ${{ inputs.auto_generate_missing }}
        REQ_DEPENDABOT:           ${{ inputs.require_dependabot }}
        REQ_CODEQL:               ${{ inputs.require_codeql }}
        REQ_EDITORCONFIG:         ${{ inputs.require_editorconfig }}
        REQ_GITATTRIBUTES:        ${{ inputs.require_gitattributes }}
        REQ_GITIGNORE:            ${{ inputs.require_gitignore }}
        REQ_MARKDOWNLINT:         ${{ inputs.require_markdownlint }}
        REQ_YAMLLINT:             ${{ inputs.require_yamllint }}
        REQ_GHAS_CODE_SCANNING:   ${{ inputs.require_ghas_code_scanning }}
        REQ_GHAS_SECRET_SCANNING: ${{ inputs.require_ghas_secret_scanning }}
        REQ_DEPENDABOT_ALERTS:    ${{ inputs.require_dependabot_alerts }}
        REQ_SECURITY_DEVOPS:      ${{ inputs.require_security_devops }}
        REQ_SCORECARD:            ${{ inputs.require_scorecard }}
        REPO_FULL:                ${{ github.repository }}
      # Delegated to a sibling script because the rendered template
      # of the inline body exceeded the GitHub Actions runner-side
      # 21000-char expression limit ("Exceeded max expression length
      # 21000"). All env vars above are inherited by the child shell.
      run: bash "${GITHUB_ACTION_PATH}/run.sh"
