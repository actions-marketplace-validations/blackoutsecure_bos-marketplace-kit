name: Lint
description: >-
  Multi-language lint orchestrator for Marketplace Action repositories.
  Auto-detects which file types are present in the working tree and
  invokes the appropriate linter for each, fanning failures into a
  single annotated job summary. Designed to be dropped into any kit
  consumer with zero configuration and tuned via inputs from there.

  Currently wired:

    * markdownlint-cli2  — `.md`           (config: .markdownlint.yaml)
    * yamllint            — `.yml`/`.yaml`  (config: .yamllint.yml)
    * shellcheck          — `.sh`           (config: .shellcheckrc)
    * actionlint          — `.github/workflows/*.yml`

  All four are install-on-demand into ephemeral cache locations on the
  runner — no global package installs, no caller setup actions needed.
  When a consumer repo does NOT ship its own lint config file, the
  composite falls back to a packaged default config bundled inside the
  action under `configs/` (one per linter). To override the packaged
  default, drop the corresponding file at the consumer repo root —
  each linter's normal auto-discovery takes precedence over the
  packaged fallback:

    * `.markdownlint.{yaml,yml,jsonc,json,cjs}` for markdownlint-cli2
    * `.yamllint` / `.yamllint.yml` / `.yamllint.yaml` for yamllint
    * `.shellcheckrc`                            for shellcheck

  This keeps the kit's contract of "zero caller setup" while ensuring
  consumers get sensible defaults out of the box.

  Each linter is independently gated by an input so consumers can
  disable any one of them without forking. The composite never auto-
  installs language toolchains it cannot reasonably justify (no ruff,
  eslint, prettier here — those belong in language-specific composites
  scaffolded by `marketplace-kit generate-policy`).

  Outputs:
    issues_total — integer; sum across all linters that ran.
    summary_path — path to the generated GHA job summary fragment.

inputs:
  run_markdownlint:
    description: >-
      Run markdownlint-cli2 against `*.md` files. Set to `false` to
      skip even when markdown is present. Requires Node.js / `npm`
      on the runner; on lean self-hosted images that lack it the
      composite attempts `apt-get install -y nodejs npm` (best
      effort, requires sudo) and degrades to a visible skip + warning
      annotation if Node is still unavailable. To guarantee a Node
      version, add `actions/setup-node` to the job before this
      composite.
    required: false
    default: 'true'

  run_yamllint:
    description: >-
      Run yamllint against `*.yml`/`*.yaml` files. Skips silently if
      no YAML is present.
    required: false
    default: 'true'

  run_shellcheck:
    description: >-
      Run shellcheck against `*.sh` files. Skips silently if no shell
      scripts are present. Composite action `run:` blocks are NOT
      extracted here — use actionlint for those.
    required: false
    default: 'true'

  run_actionlint:
    description: >-
      Run actionlint against `.github/workflows/*.yml`. Skips silently
      if no workflows are present (e.g. when the repo only ships
      composite actions consumed by callers).
    required: false
    default: 'true'

  paths_md:
    description: >-
      Newline-separated globs (relative to repo root) to scan for
      markdown. Default scans the whole repo. Use to exclude
      `vendor/`, `node_modules/`, etc. that should already be in
      .gitignore but might sneak in.
    required: false
    default: '**/*.md'

  paths_yaml:
    description: >-
      Newline-separated globs for YAML files.
    required: false
    default: |
      **/*.yml
      **/*.yaml

  paths_shell:
    description: >-
      Newline-separated globs for shell scripts.
    required: false
    default: '**/*.sh'

  severity:
    description: >-
      How findings affect the workflow result. One of:
        * `fail`   — non-zero exit if any linter finds an issue
                     (recommended for CI gates).
        * `warn`   — annotate findings, but the action exits 0.
        * `skip`   — disable the entire composite (useful for
                     conditional callers).
    required: false
    default: 'fail'

  markdownlint_version:
    description: >-
      npm version spec for markdownlint-cli2. Pinned for reproducible
      runs; bump deliberately when newer rules are wanted.
    required: false
    default: '0.18.1'

  yamllint_version:
    description: >-
      pip version spec for yamllint.
    required: false
    default: '1.37.0'

  actionlint_version:
    description: >-
      Tag of rhysd/actionlint to download. Must exist on the
      actionlint GitHub Releases page. The composite downloads the
      pinned binary directly (no `apt install`), keeping behaviour
      reproducible across runner images.
    required: false
    default: 'v1.7.7'

outputs:
  issues_total:
    description: Total number of lint findings across all linters that ran.
    value: ${{ steps.run.outputs.issues_total }}
  summary_path:
    description: Path to the generated job-summary markdown fragment.
    value: ${{ steps.run.outputs.summary_path }}

runs:
  using: composite
  steps:
    - name: Lint
      id: run
      shell: bash
      env:
        RUN_MARKDOWNLINT: ${{ inputs.run_markdownlint }}
        RUN_YAMLLINT: ${{ inputs.run_yamllint }}
        RUN_SHELLCHECK: ${{ inputs.run_shellcheck }}
        RUN_ACTIONLINT: ${{ inputs.run_actionlint }}
        PATHS_MD: ${{ inputs.paths_md }}
        PATHS_YAML: ${{ inputs.paths_yaml }}
        PATHS_SHELL: ${{ inputs.paths_shell }}
        SEVERITY: ${{ inputs.severity }}
        MDLINT_VERSION: ${{ inputs.markdownlint_version }}
        YAMLLINT_VERSION: ${{ inputs.yamllint_version }}
        ACTIONLINT_VERSION: ${{ inputs.actionlint_version }}
      run: |
        set -euo pipefail

        # ----- helpers ---------------------------------------------------
        die() { printf '::error::%s\n' "$*" >&2; exit 1; }
        warn() { printf '::warning::%s\n' "$*" >&2; }
        info() { printf '::notice::%s\n' "$*" >&2; }

        # Normalise severity early so an invalid value fails fast.
        case "${SEVERITY}" in
          fail|warn|skip) : ;;
          *) die "invalid severity='${SEVERITY}'; expected fail|warn|skip" ;;
        esac

        if [[ "${SEVERITY}" == "skip" ]]; then
          info "lint composite skipped (severity=skip)"
          {
            echo "issues_total=0"
            echo "summary_path="
          } >> "${GITHUB_OUTPUT}"
          exit 0
        fi

        # Single summary fragment for the whole composite.
        SUMMARY="${RUNNER_TEMP:-/tmp}/lint-summary.md"
        : > "${SUMMARY}"
        echo "## Lint results" >> "${SUMMARY}"
        echo "" >> "${SUMMARY}"
        echo "| Linter | Status | Findings |" >> "${SUMMARY}"
        echo "|---|---|---|" >> "${SUMMARY}"

        TOTAL_ISSUES=0
        ANY_FAIL=0

        # Newline-separated globs → expanded file list via find.
        # We deliberately avoid `globstar` because runners may not have
        # it enabled in the implicit shell.
        expand_globs() {
          local globs="$1"
          local f
          while IFS= read -r pat; do
            [[ -z "${pat}" ]] && continue
            # shellcheck disable=SC2086
            find . -type f -path "./${pat}" 2>/dev/null || true
            # Also try without leading ./ in case the pattern is rooted.
            find . -type f -path "${pat}" 2>/dev/null || true
          done <<< "${globs}" | sort -u
        }

        run_linter() {
          local label="$1"; shift
          local count_file="$1"; shift
          local rc=0
          "$@" || rc=$?
          local n=0
          [[ -s "${count_file}" ]] && n=$(wc -l < "${count_file}" | tr -d ' ')
          TOTAL_ISSUES=$(( TOTAL_ISSUES + n ))
          if [[ "${rc}" -ne 0 ]]; then
            echo "| ${label} | ❌ fail (rc=${rc}) | ${n} |" >> "${SUMMARY}"
            ANY_FAIL=1
          elif [[ "${n}" -gt 0 ]]; then
            echo "| ${label} | ⚠ warn | ${n} |" >> "${SUMMARY}"
          else
            echo "| ${label} | ✅ clean | 0 |" >> "${SUMMARY}"
          fi
        }

        # ----- markdownlint ---------------------------------------------
        if [[ "${RUN_MARKDOWNLINT}" == "true" ]]; then
          MD_FILES=$(expand_globs "${PATHS_MD}")
          if [[ -n "${MD_FILES}" ]]; then
            # markdownlint-cli2 is a Node package; the runner must have
            # `npm` available. ubuntu-latest ships it preinstalled,
            # but lean self-hosted images often don't — try apt as a
            # best-effort fallback (mirrors the shellcheck pattern
            # below), then degrade to a visible skip if even apt is
            # unavailable. The kit's "no caller setup required"
            # contract is preserved on the happy path; the warning
            # tells operators what to do when it can't be honoured.
            if ! command -v npm >/dev/null 2>&1; then
              if command -v sudo >/dev/null 2>&1 && command -v apt-get >/dev/null 2>&1; then
                # Hard 90 s ceiling on each apt call. Lean self-hosted
                # runners occasionally point at a slow/unreachable
                # mirror; without `timeout` the install can hang for
                # the entire job timeout (we've seen 4-5 min stalls
                # cancelled by the runner). Treat hang == fail and let
                # the `command -v npm` re-check below trigger the
                # graceful "skip with warning" path.
                info "npm not found; attempting apt-get install nodejs npm (90s timeout)"
                timeout 90 sudo apt-get update -qq || true
                timeout 90 sudo apt-get install -y -qq nodejs npm >/dev/null 2>&1 || true
              fi
            fi
            if ! command -v npm >/dev/null 2>&1; then
              warn "npm not available on this runner; skipping markdownlint. To enable, either install Node.js on the runner image or add 'uses: actions/setup-node@v4' to the job before this composite."
              echo "| markdownlint | ⊘ skipped (npm unavailable) | 0 |" >> "${SUMMARY}"
            else
              info "markdownlint-cli2: ${MDLINT_VERSION}"
              # Install into RUNNER_TEMP -- NOT the repo root -- so that
              # the dependency tree's own bundled `*.md` files (e.g.
              # `node_modules/@nodelib/fs.scandir/README.md`) don't get
              # swept up by the default `**/*.md` glob in the next step.
              # Symptom of the old behaviour was a 1562-finding report
              # where every line was inside `node_modules/`, masking any
              # real findings in the user's tree.
              MD_TMP="${RUNNER_TEMP:-/tmp}/marketplace-kit-markdownlint"
              mkdir -p "${MD_TMP}"
              npm install --silent --no-save --prefix "${MD_TMP}" \
                "markdownlint-cli2@${MDLINT_VERSION}" \
                >/dev/null
              MD_BIN="${MD_TMP}/node_modules/.bin/markdownlint-cli2"
              CNT="${RUNNER_TEMP:-/tmp}/md-issues.txt"
              # markdownlint-cli2 auto-discovers .markdownlint.{yaml,yml,
              # jsonc,json,cjs} at the repo root. When none is present
              # we explicitly point at the packaged default shipped
              # inside this action so consumers get sensible defaults
              # out of the box (override by dropping any of the above).
              MD_EXTRA_ARGS=()
              if ! ls -1 .markdownlint.yaml .markdownlint.yml \
                       .markdownlint.jsonc .markdownlint.json \
                       .markdownlint.cjs 2>/dev/null | grep -q .; then
                MD_EXTRA_ARGS+=( --config "${GITHUB_ACTION_PATH}/configs/markdownlint.yaml" )
                info "markdownlint: using packaged default config (no repo-local .markdownlint.* found)"
              fi
              # shellcheck disable=SC2086
              "${MD_BIN}" "${MD_EXTRA_ARGS[@]}" ${PATHS_MD} 2>&1 | tee "${CNT}" || true
              # The presence of any "MD###" code in output indicates findings.
              grep -cE '(^|: )MD[0-9]{3}' "${CNT}" > "${CNT}.count" || true
              CNT_NUM=$(cat "${CNT}.count" 2>/dev/null || echo 0)
              : > "${CNT}.lines"
              for i in $(seq 1 "${CNT_NUM:-0}"); do echo x >> "${CNT}.lines"; done
              run_linter "markdownlint" "${CNT}.lines" true
            fi
          else
            echo "| markdownlint | ⊘ no .md files | 0 |" >> "${SUMMARY}"
          fi
        else
          echo "| markdownlint | ⊘ disabled | 0 |" >> "${SUMMARY}"
        fi

        # ----- yamllint -------------------------------------------------
        if [[ "${RUN_YAMLLINT}" == "true" ]]; then
          YAML_FILES=$(expand_globs "${PATHS_YAML}")
          if [[ -n "${YAML_FILES}" ]]; then
            info "yamllint: ${YAMLLINT_VERSION}"
            # Lean self-hosted runner images (e.g. our balena-based
            # docker-github-runner) ship `python3` without `pip` to keep
            # the image small. The old `python3 -m pip install` line
            # then died with `No module named pip` and aborted the job
            # under `set -euo pipefail`. Probe each install path in
            # decreasing fidelity (preserve the version pin if we can,
            # else fall back to whatever yamllint apt ships, else skip
            # gracefully with a visible summary row).
            INSTALLED=0
            if command -v yamllint >/dev/null 2>&1; then
              INSTALLED=1
            fi
            if [[ "${INSTALLED}" -eq 0 ]] && python3 -m pip --version >/dev/null 2>&1; then
              if python3 -m pip install --quiet "yamllint==${YAMLLINT_VERSION}"; then
                INSTALLED=1
              fi
            fi
            if [[ "${INSTALLED}" -eq 0 ]] && command -v sudo >/dev/null 2>&1 && command -v apt-get >/dev/null 2>&1; then
              info "pip unavailable; attempting to install python3-pip then retry pip install (90s timeout per apt call)"
              if timeout 90 sudo apt-get update -qq >/dev/null 2>&1 \
                 && timeout 90 sudo apt-get install -y -qq python3-pip >/dev/null 2>&1 \
                 && timeout 90 python3 -m pip install --quiet "yamllint==${YAMLLINT_VERSION}"; then
                INSTALLED=1
              fi
            fi
            if [[ "${INSTALLED}" -eq 0 ]] && command -v sudo >/dev/null 2>&1 && command -v apt-get >/dev/null 2>&1; then
              info "falling back to apt-packaged yamllint (version pin '${YAMLLINT_VERSION}' lost; 90s timeout)"
              if timeout 90 sudo apt-get install -y -qq yamllint >/dev/null 2>&1; then
                INSTALLED=1
              fi
            fi
            if [[ "${INSTALLED}" -eq 0 ]]; then
              warn "yamllint could not be installed on this runner (no pip module, no apt access, and yamllint not preinstalled); skipping yamllint. To enable, install python3-pip OR yamllint on the runner image, OR add 'uses: actions/setup-python@v5' to the job before this composite."
              echo "| yamllint | ⊘ skipped (install failed) | 0 |" >> "${SUMMARY}"
            else
              CNT="${RUNNER_TEMP:-/tmp}/yaml-issues.txt"
              # yamllint auto-discovers .yamllint / .yamllint.yml /
              # .yamllint.yaml at the repo root. When none is present
              # we explicitly point at the packaged default shipped
              # inside this action so consumers get sensible defaults
              # out of the box (override by dropping any of the above).
              YAML_CFG_ARGS=()
              if ! ls -1 .yamllint .yamllint.yml .yamllint.yaml \
                   2>/dev/null | grep -q .; then
                YAML_CFG_ARGS+=( -c "${GITHUB_ACTION_PATH}/configs/yamllint.yml" )
                info "yamllint: using packaged default config (no repo-local .yamllint* found)"
              fi
              yamllint "${YAML_CFG_ARGS[@]}" -f github . 2>&1 | tee "${CNT}" || true
              # yamllint -f github emits "::warning" / "::error" per finding.
              grep -cE '^::(warning|error)' "${CNT}" > "${CNT}.count" || true
              CNT_NUM=$(cat "${CNT}.count" 2>/dev/null || echo 0)
              : > "${CNT}.lines"
              for i in $(seq 1 "${CNT_NUM:-0}"); do echo x >> "${CNT}.lines"; done
              run_linter "yamllint" "${CNT}.lines" true
            fi
          else
            echo "| yamllint | ⊘ no .yml files | 0 |" >> "${SUMMARY}"
          fi
        else
          echo "| yamllint | ⊘ disabled | 0 |" >> "${SUMMARY}"
        fi

        # ----- shellcheck -----------------------------------------------
        if [[ "${RUN_SHELLCHECK}" == "true" ]]; then
          SH_FILES=$(expand_globs "${PATHS_SHELL}")
          if [[ -n "${SH_FILES}" ]]; then
            if ! command -v shellcheck >/dev/null 2>&1; then
              # ubuntu-latest images ship shellcheck preinstalled. Fall back
              # to apt only if not present (rare). Same 90 s ceiling as
              # the markdownlint/yamllint paths above; mirrored `|| true`
              # so a hung mirror skips shellcheck with a visible warning
              # instead of aborting the whole lint composite under
              # `set -euo pipefail`. The post-install re-check below
              # converts a failure into a clean degrade.
              if command -v sudo >/dev/null 2>&1 && command -v apt-get >/dev/null 2>&1; then
                info "shellcheck not found; attempting apt-get install shellcheck (90s timeout)"
                timeout 90 sudo apt-get update -qq || true
                timeout 90 sudo apt-get install -y -qq shellcheck >/dev/null 2>&1 || true
              fi
            fi
            if command -v shellcheck >/dev/null 2>&1; then
              info "shellcheck: $(shellcheck --version | awk '/^version/ {print $2}')"
              CNT="${RUNNER_TEMP:-/tmp}/sh-issues.txt"
              # "Note:" prefix avoids shellcheck parsing the comment
              # below as a malformed directive (SC1072/SC1073).
              # Note: shellcheck auto-discovers .shellcheckrc in each
              # file's directory and any parent. When the consumer repo
              # does NOT ship one at the repo root, we point shellcheck
              # at the packaged default via --rcfile so consumers get
              # sensible defaults out of the box (drop a .shellcheckrc
              # at the consumer repo root to override — the auto-search
              # finds it before we ever set --rcfile, but for clarity
              # we only pass --rcfile when no repo-local file exists).
              SH_RC_ARGS=()
              if [[ ! -f .shellcheckrc ]]; then
                SH_RC_ARGS+=( --rcfile="${GITHUB_ACTION_PATH}/configs/shellcheckrc" )
                info "shellcheck: using packaged default config (no repo-local .shellcheckrc found)"
              fi
              # shellcheck disable=SC2086
              echo "${SH_FILES}" | xargs -r shellcheck "${SH_RC_ARGS[@]}" --format=gcc 2>&1 | tee "${CNT}" || true
              # gcc format: one finding per line, look for ":line:col: severity:"
              grep -cE ':[0-9]+:[0-9]+: (error|warning|note|info):' "${CNT}" > "${CNT}.count" || true
              CNT_NUM=$(cat "${CNT}.count" 2>/dev/null || echo 0)
              : > "${CNT}.lines"
              for i in $(seq 1 "${CNT_NUM:-0}"); do echo x >> "${CNT}.lines"; done
              run_linter "shellcheck" "${CNT}.lines" true
            else
              warn "shellcheck could not be installed on this runner (no apt access, or apt fetch exceeded 90 s); skipping. To enable, bake shellcheck into the runner image or add a setup step before this composite."
              echo "| shellcheck | ⊘ skipped (install failed) | 0 |" >> "${SUMMARY}"
            fi
          else
            echo "| shellcheck | ⊘ no .sh files | 0 |" >> "${SUMMARY}"
          fi
        else
          echo "| shellcheck | ⊘ disabled | 0 |" >> "${SUMMARY}"
        fi

        # ----- actionlint -----------------------------------------------
        if [[ "${RUN_ACTIONLINT}" == "true" ]]; then
          if [[ -d .github/workflows ]] && \
             compgen -G ".github/workflows/*.y*ml" >/dev/null; then
            info "actionlint: ${ACTIONLINT_VERSION}"
            # actionlint provides a script that downloads the right
            # binary for the runner's OS/arch.
            TMP_AL="${RUNNER_TEMP:-/tmp}/actionlint"
            mkdir -p "${TMP_AL}"
            ( cd "${TMP_AL}" && \
              curl -fsSL "https://raw.githubusercontent.com/rhysd/actionlint/${ACTIONLINT_VERSION}/scripts/download-actionlint.bash" \
                | bash -s -- "${ACTIONLINT_VERSION#v}" >/dev/null
            )
            CNT="${RUNNER_TEMP:-/tmp}/al-issues.txt"
            "${TMP_AL}/actionlint" -color 2>&1 | tee "${CNT}" || true
            # actionlint default format: file:line:col: msg [code]
            grep -cE '^[^:]+:[0-9]+:[0-9]+:' "${CNT}" > "${CNT}.count" || true
            CNT_NUM=$(cat "${CNT}.count" 2>/dev/null || echo 0)
            : > "${CNT}.lines"
            for i in $(seq 1 "${CNT_NUM:-0}"); do echo x >> "${CNT}.lines"; done
            run_linter "actionlint" "${CNT}.lines" true
          else
            echo "| actionlint | ⊘ no workflows | 0 |" >> "${SUMMARY}"
          fi
        else
          echo "| actionlint | ⊘ disabled | 0 |" >> "${SUMMARY}"
        fi

        # ----- finalise --------------------------------------------------
        echo "" >> "${SUMMARY}"
        echo "**Total findings:** ${TOTAL_ISSUES}" >> "${SUMMARY}"

        if [[ -n "${GITHUB_STEP_SUMMARY:-}" ]]; then
          cat "${SUMMARY}" >> "${GITHUB_STEP_SUMMARY}"
        fi

        {
          echo "issues_total=${TOTAL_ISSUES}"
          echo "summary_path=${SUMMARY}"
        } >> "${GITHUB_OUTPUT}"

        if [[ "${ANY_FAIL}" -eq 1 && "${SEVERITY}" == "fail" ]]; then
          die "lint composite found issues (total=${TOTAL_ISSUES}); see job summary"
        elif [[ "${ANY_FAIL}" -eq 1 ]]; then
          warn "lint composite found issues (total=${TOTAL_ISSUES}) but severity=warn; not failing"
        else
          info "lint composite clean (total=${TOTAL_ISSUES})"
        fi
