version: 2

# NOTE: This repo uses a dev -> main Marketplace promote model
# (`.github/workflows/release.yml`). Dependabot's `dependabot.yml`
# MUST live on the default branch (main) — that's a Dependabot
# constraint — but PRs need to target `dev`, where the SHA pins are
# the source of truth. Without `target-branch: dev` below, Dependabot
# PRs land on main and get wiped by the next promote run, creating a
# treadmill. The override is applied INSIDE the managed-by-upstream
# markers because there is no live sync from bos-automation-hub into
# this repo (one-time paste only) — if a future sync is wired up, add
# a `target-branch` knob to the upstream template instead of dropping
# this override.
updates:



# >>> managed-file-sync:dependabot_actions >>>
# Managed by Blackout Secure Managed File Sync — configure services in .github/bos-universal-config.json.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(deps)"
    labels:
      - dependencies
# <<< managed-file-sync:dependabot_actions <<<

# >>> managed-file-sync:dependabot_pip >>>
# Managed by Blackout Secure Managed File Sync — configure services in .github/bos-universal-config.json.
  - package-ecosystem: pip
    directory: /
    target-branch: dev
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: "Etc/UTC"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore"
      include: scope
    labels:
      - dependencies
      - python
# <<< managed-file-sync:dependabot_pip <<<
