# Blackout Secure code-scan launchpad caller for this kit.
#
# Thin event-trigger wrapper around the hub-side reusable
# `bos-launchpad-code-scan.yml` in blackoutsecure/bos-automation-hub.
# Filename mirrors the hub reusable's name so the consumer surface in
# every kit is uniform (`bos-launchpad-<domain>.yml`).
#
# Consolidated security scan: kit composite (posture + actionlint + gitleaks +
# shellcheck) AND CodeQL matrix, both calling the hub-side reusable so a
# single change in `bos-automation-hub` propagates here on next run.
#
# ────────────────────────────────────────────────────────────────────
# SCANNING_PAT — what to put in the secret
# ────────────────────────────────────────────────────────────────────
# `SCANNING_PAT` is optional. When absent, PS002 (secret scanning),
# PS003 (Dependabot alerts), and PS020-PS025 (branch protection) emit
# `skip` findings because `GITHUB_TOKEN` lacks admin reach. Adding the
# PAT upgrades those rows to real `pass`/`fail` evaluations.
#
# Policy: when `SCANNING_PAT` is provisioned (org- or repo-level), this
# workflow runs in advanced mode automatically on every push / PR / dispatch.
# The secret's presence IS the signal of intent — an operator who minted,
# scoped and stored the PAT does not also want a redundant flag flipped
# before the kit will honour it. Explicit opt-out (for one-off baseline
# sweeps) is preserved via either:
#   • repo or org var `BOS_SCAN_ADVANCED=false`, or
#   • workflow_dispatch input `advanced_scanning=false`.
# Input wins over var wins over the implicit PAT default.
#
# Classic PAT: tick ONLY `repo` (top-level — the only classic scope
# that covers both `security_events` AND admin-read on branch
# protection / vulnerability-alerts). Untick `workflow`, `admin:org`,
# `admin:enterprise`, `delete_repo`, `*:packages`, `admin:*_hook`,
# `gist`, `user`, `audit_log`. Configure SSO → Authorize for every
# SAML-enforced org. See
# https://github.com/blackoutsecure/bos-code-scanning-kit#-scanning_pat--advanced-posture-credentials
# for the full classic + fine-grained checklist.
#
# Storage: this repo's Settings → Secrets and variables → Actions →
# Secrets → `SCANNING_PAT` (or at the org level with this repo in
# the access policy). Rotate ≤90 days.
#
# Replaces what used to be two separate workflows in this repo:
#   * `codeql.yml`   — CodeQL matrix only (`enable_kit_composite: false`)
#   * `self-scan.yml`— kit composite only, with PAT-aware advanced mode
# The hub reusable now accepts an optional `scanning_pat` secret +
# `use_advanced_pat` input, so both stages can run from one caller without
# losing the PS002/PS003 posture probes that need elevated API scope.
#
# Why this kit calls the code-scan reusable DIRECTLY rather than via the
# Marketplace Launchpad's `enable_security_scan: true` knob: this kit is the
# PRODUCER of the marketplace launchpad's `check` / `lint` / `guard` /
# `promote` / `branding-preview` / `name-check` composite actions. Calling
# the full marketplace launchpad would invoke the PUBLISHED `@v0.1.x`
# composites against this repo's `dev` source, defeating the in-tree
# testing model that `self-check.yml` / `self-guard.yml` provide (local
# `./` composites against current dev code). The code-scan reusable has no
# such producer/consumer tension and is safe to consume directly.
#
# Transitive invocations performed by the hub-side reusable (kept inline here
# so audit tooling and the marketplace-kit CQ001 detector can see them at
# this repo's surface):
#
#   uses: blackoutsecure/bos-code-scanning-kit@v1
#   uses: github/codeql-action/init@7211b7c8077ea37d8641b6271f6a365a22a5fbfa    # v4.36.0
#   uses: github/codeql-action/analyze@7211b7c8077ea37d8641b6271f6a365a22a5fbfa # v4.36.0
#
# Bump the SHAs above in lockstep with
# `bos-automation-hub/.github/workflows/bos-launchpad-code-scan.yml`.

# `name:` is intentionally NOT renamed alongside the file. GitHub surfaces
# it as the Actions-tab label, the SARIF tool name in the Security tab, and
# the check-run name that branch protection keys off. Renaming would orphan
# any protection rule requiring "Security scan" to be green.
name: Security scan

"on":
  push:
    branches: [dev]
  pull_request:
    branches: [dev]
  workflow_dispatch:
    inputs:
      fail_on:
        description: 'Kit composite fail policy (`fail` | `never`).'
        required: false
        type: choice
        default: 'never'
        options: ['never', 'fail']
      advanced_scanning:
        description: >-
          Override advanced posture probes (PS002/PS003 + branch protection)
          for this run. Default `true` matches the PAT-implies-advanced
          policy: when SCANNING_PAT is provisioned, advanced mode is on.
          Set `false` for a one-off baseline-only run. Set `true` here +
          `require_pat=true` to force-validate that SCANNING_PAT is wired up.
        required: false
        type: boolean
        default: true
      require_pat:
        description: >-
          Fail fast if advanced mode was explicitly opted-in (this input or
          `BOS_SCAN_ADVANCED=true`) but SCANNING_PAT is missing. Does NOT
          fire on the implicit PAT-present default — that path already
          self-disables silently when the PAT is unavailable.
        required: false
        type: boolean
        default: false
      http_timeout:
        description: >-
          Per-request HTTP timeout (seconds) for the kit's posture probes.
          Default `20`. Bump on slow self-hosted egress or when GH API
          latency surfaces as `PS*** error: HTTP 502 / timeout` rows.
          Bare integer string; no unit. Forwarded to the hub reusable's
          `kit_http_timeout` input.
        required: false
        type: string
        default: '20'

permissions:
  contents: read

concurrency:
  group: bos-launchpad-code-scan-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # Resolve advanced-PAT mode + verify secret availability before the scan
  # reusable runs. Three precedence layers (later overrides earlier):
  #   1. HAS_PAT presence                 — implicit baseline policy
  #   2. BOS_SCAN_ADVANCED repo/org var   — operator-wide override
  #   3. workflow_dispatch input          — one-off run override
  # `require_pat` is a fail-fast guard for the EXPLICIT opt-in path only:
  # the implicit PAT-present default already self-disables when the PAT is
  # missing, so no diagnostic is needed there.
  # ---------------------------------------------------------------------------
  preflight:
    name: Preflight (PAT mode)
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      use_advanced_pat: ${{ steps.mode.outputs.use_advanced_pat }}
    steps:
      - id: mode
        name: Resolve advanced PAT mode
        env:
          # `format('{0}', bool)` yields literal 'true'/'false' so the
          # bash side can distinguish explicit opt-OUT from "no opinion";
          # the earlier `&& 'true' || ''` form collapsed `false` and
          # "not workflow_dispatch" into the same empty string.
          INPUT_ADVANCED: ${{ github.event_name == 'workflow_dispatch' && format('{0}', inputs.advanced_scanning) || '' }}
          INPUT_REQUIRE_PAT: ${{ github.event_name == 'workflow_dispatch' && format('{0}', inputs.require_pat) || '' }}
          VAR_ADVANCED: ${{ vars['BOS_SCAN_ADVANCED'] }}
          VAR_REQUIRE_PAT: ${{ vars['BOS_SCAN_REQUIRE_PAT'] }}
          HAS_PAT: ${{ secrets['SCANNING_PAT'] != '' && 'true' || 'false' }}
        run: |
          set -euo pipefail

          is_true() {
            case "${1:-}" in
              true|TRUE|True|1|yes|YES|on|ON) return 0 ;;
              *) return 1 ;;
            esac
          }

          is_false() {
            case "${1:-}" in
              false|FALSE|False|0|no|NO|off|OFF) return 0 ;;
              *) return 1 ;;
            esac
          }

          # Layer 1: implicit PAT-present default.
          advanced_requested=false
          if [ "${HAS_PAT}" = "true" ]; then
            advanced_requested=true
          fi

          # Layer 2: repo/org var explicit override.
          if is_true "${VAR_ADVANCED}"; then
            advanced_requested=true
          elif is_false "${VAR_ADVANCED}"; then
            advanced_requested=false
          fi

          # Layer 3: workflow_dispatch input explicit override.
          if is_true "${INPUT_ADVANCED}"; then
            advanced_requested=true
          elif is_false "${INPUT_ADVANCED}"; then
            advanced_requested=false
          fi

          # Did the operator *explicitly* opt in (input or var)? Used
          # only for the `require_pat` fail-fast diagnostic — the
          # implicit PAT-present default does not trigger it.
          explicitly_requested=false
          if is_true "${INPUT_ADVANCED}" || is_true "${VAR_ADVANCED}"; then
            explicitly_requested=true
          fi

          require_pat=false
          if is_true "${INPUT_REQUIRE_PAT}" || is_true "${VAR_REQUIRE_PAT}"; then
            require_pat=true
          fi

          use_advanced_pat=false
          if [ "${advanced_requested}" = "true" ] && [ "${HAS_PAT}" = "true" ]; then
            use_advanced_pat=true
          fi

          if [ "${explicitly_requested}" = "true" ] && [ "${HAS_PAT}" != "true" ] && [ "${require_pat}" = "true" ]; then
            echo "::error::Advanced scanning was explicitly requested (input or BOS_SCAN_ADVANCED=true), but secret SCANNING_PAT is not configured."
            exit 1
          fi

          if [ "${explicitly_requested}" = "true" ] && [ "${HAS_PAT}" != "true" ]; then
            echo "::warning::Advanced scanning explicitly requested but SCANNING_PAT is missing. Falling back to GITHUB_TOKEN (PS002/PS003 will be skipped)."
          fi

          echo "use_advanced_pat=${use_advanced_pat}" >> "${GITHUB_OUTPUT}"

          # Surface which path was taken so operators can audit policy
          # resolution from the run page without re-reading the YAML.
          {
            echo "## Code-scan preflight"
            echo ""
            echo "| Signal | Value |"
            echo "|---|---|"
            echo "| SCANNING_PAT present | \`${HAS_PAT}\` |"
            echo "| BOS_SCAN_ADVANCED var | \`${VAR_ADVANCED:-(unset)}\` |"
            echo "| advanced_scanning input | \`${INPUT_ADVANCED:-(n/a — non-dispatch)}\` |"
            echo "| → use_advanced_pat | **\`${use_advanced_pat}\`** |"
          } >> "${GITHUB_STEP_SUMMARY:-/dev/stderr}"

  # ---------------------------------------------------------------------------
  # Consolidated scan: kit composite + CodeQL matrix, both via the hub
  # reusable. `secrets: inherit` forwards SCANNING_PAT (if configured at
  # the org/repo level) so the reusable can pass it to the kit composite
  # only when `use_advanced_pat` is true.
  #
  # `codeql_languages`: `["python", "actions"]` covers
  # `src/marketplace_kit/` (Python CLI), the kit's composite `action.yml`,
  # and all workflow YAML in `.github/workflows/`. The value is parsed by
  # the reusable with `fromJSON` to drive a matrix, so entries MUST be
  # double-quoted JSON strings \u2014 YAML flow-list shorthand
  # `[python, actions]` is rejected with
  # `fromJSON: Unexpected symbol: 'python'`.
  # ---------------------------------------------------------------------------
  scan:
    needs: preflight
    uses: blackoutsecure/bos-automation-hub/.github/workflows/bos-launchpad-code-scan.yml@main
    permissions:
      contents: read
      security-events: write
      actions: read
    with:
      enable_kit_composite: true
      enable_posture:       true
      enable_scanners:      true
      enable_upload:        true
      fail_on:              ${{ inputs.fail_on || 'never' }}
      use_advanced_pat:     ${{ needs.preflight.outputs.use_advanced_pat == 'true' }}
      kit_http_timeout:     ${{ inputs.http_timeout || '20' }}
      codeql_languages:     '["python", "actions"]'
      codeql_queries:       security-and-quality
    secrets: inherit
