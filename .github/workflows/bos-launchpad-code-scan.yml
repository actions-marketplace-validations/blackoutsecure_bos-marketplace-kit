name: Security Scan

on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-scan-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scan:
    uses: blackoutsecure/bos-automation-hub/.github/workflows/security-scan.yml@main
    permissions:
      security-events: write
      contents: read
      actions: read
    with:
      codeql_languages: '["python", "actions"]'
      codeql_queries: security-and-quality
