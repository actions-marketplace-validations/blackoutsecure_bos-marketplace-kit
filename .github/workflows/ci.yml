# CI for bos-marketplace-kit itself.
#
# Runs on every PR against `dev` and every push to `dev`. Validates:
#   * All workflow files lint clean with actionlint.
#   * All composite-action shell bodies pass shellcheck.
#   * The Python CLI scaffold (if present) imports cleanly.
#
# This workflow lives on `dev` only. It is NEVER promoted to `main`
# (Marketplace publishing prohibits workflows on the default branch).
name: ci

"on":
  push:
    branches: [dev]
  pull_request:
    branches: [dev]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  actionlint:
    name: actionlint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Install actionlint
        env:
          AL_VERSION: v1.7.7
          AL_SHA256:  023070a287cd8cccd71515fedc843f1985bf96c436b7effaecce67290e7e0757
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 --retry-delay 2 \
            "https://github.com/rhysd/actionlint/releases/download/${AL_VERSION}/actionlint_${AL_VERSION#v}_linux_amd64.tar.gz" \
            -o actionlint.tar.gz
          echo "${AL_SHA256}  actionlint.tar.gz" | sha256sum -c -
          tar -xzf actionlint.tar.gz actionlint
          chmod +x actionlint
          mv actionlint /usr/local/bin/
          actionlint --version
      - name: Run actionlint
        run: actionlint -no-color

  shellcheck:
    name: shellcheck (composite + scripts)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Install shellcheck
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends shellcheck
          shellcheck --version
      - name: Install yq (for YAML extraction)
        env:
          YQ_VERSION: v4.44.3
          YQ_SHA256:  cfbbb9ba72c9402ef4ab9d8f843439693dfb380927921740e51706d90869c7e1
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 -o /usr/local/bin/yq \
            "https://github.com/mikefarah/yq/releases/download/${YQ_VERSION}/yq_linux_amd64"
          echo "${YQ_SHA256}  /usr/local/bin/yq" | sha256sum -c -
          sudo chmod +x /usr/local/bin/yq
          yq --version
      - name: Lint bash scripts
        run: |
          set -euo pipefail
          shellcheck --severity=warning --shell=bash scripts/*.sh
      - name: Lint composite-action run bodies
        run: |
          set -euo pipefail
          # Extract every `run: |` body from each composite action.yml
          # to a temp .sh file, then shellcheck the lot.
          tmp="$(mktemp -d)"
          # shellcheck disable=SC2064
          trap "rm -rf '${tmp}'" EXIT

          find actions action.yml -type f \( -name 'action.yml' -o -name 'action.yaml' \) 2>/dev/null | sort -u | while IFS= read -r f; do
            [ -z "${f}" ] && continue
            n=$(yq -r '.runs.steps | length // 0' "${f}")
            [ "${n}" = "0" ] && continue
            i=0
            while [ "${i}" -lt "${n}" ]; do
              shell=$(yq -r ".runs.steps[${i}].shell // \"\"" "${f}")
              body=$(yq -r ".runs.steps[${i}].run // \"\"" "${f}")
              if [ "${shell}" = "bash" ] && [ -n "${body}" ] && [ "${body}" != "null" ]; then
                slug="$(printf '%s' "${f}" | sed -E 's#[/.]+#_#g')"
                printf '#!/usr/bin/env bash\n%s\n' "${body}" > "${tmp}/${slug}__${i}.sh"
              fi
              i=$((i + 1))
            done
          done
          if [ -z "$(find "${tmp}" -name '*.sh' 2>/dev/null)" ]; then
            echo "No composite action bash bodies extracted."
            exit 0
          fi
          shellcheck --severity=warning --shell=bash "${tmp}"/*.sh

  bash-syntax:
    name: bash -n on composite bodies
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: bash -n
        run: |
          set -euo pipefail
          for f in scripts/*.sh; do
            bash -n "${f}"
          done
          echo "bash syntax OK for all scripts/"

  python-cli:
    name: Python CLI (smoke)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - name: Install
        run: |
          set -euo pipefail
          if [ -f pyproject.toml ]; then
            python -m pip install --upgrade pip
            python -m pip install -e ".[dev]"
          else
            echo "No pyproject.toml — skipping CLI smoke."
            exit 0
          fi
      - name: Import + CLI smoke
        run: |
          set -euo pipefail
          if [ -f pyproject.toml ]; then
            python -c "import marketplace_kit; print(marketplace_kit.__version__)"
            marketplace-kit --help
          fi
      - name: pytest
        run: |
          set -euo pipefail
          if [ -d tests ] && [ -f pyproject.toml ]; then
            python -m pytest -q
          else
            echo "No tests yet — skipping."
          fi
