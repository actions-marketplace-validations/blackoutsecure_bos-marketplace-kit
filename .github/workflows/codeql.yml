# CodeQL analysis for bos-marketplace-kit.
#
# Scans the Python CLI and shipped JavaScript-free composite actions
# for vulnerability patterns. CodeQL is free for public repositories
# under GitHub Advanced Security; findings appear in the Security tab.
#
# This workflow lives on `dev` only — Marketplace publishing rules
# prohibit workflows on `main`. CodeQL still gets a complete view of
# the source because it runs on every PR + every push to `dev`.

name: CodeQL

on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev]
  schedule:
    # Weekly drift catch. Monday 07:00 UTC — staggered after dependabot
    # (which runs Monday 06:00 UTC) so any new advisories are exercised
    # against the post-dependabot tree.
    - cron: '0 7 * * 1'

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 30

    permissions:
      # Required by github/codeql-action to upload SARIF.
      security-events: write
      # Required to fetch the repo with full history for query analysis.
      contents: read
      # Required for the action to read the action.yml metadata when
      # autobuild scans composites.
      actions: read

    strategy:
      fail-fast: false
      matrix:
        # Only languages with source in this repo are listed. JavaScript
        # is intentionally excluded — composite actions here have no JS
        # entrypoint.
        language: [python, actions]

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@03e4368ac7daa2bd82b3e85262f3bf87ee112f57 # v3.36.0
        with:
          languages: ${{ matrix.language }}
          # security-and-quality covers both vulnerability and code-quality
          # patterns. Use 'security-extended' for higher recall if noise
          # becomes acceptable.
          queries: security-and-quality

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@03e4368ac7daa2bd82b3e85262f3bf87ee112f57 # v3.36.0
        with:
          category: "/language:${{ matrix.language }}"
