# Marketplace-compliant release: promote `dev` -> `main` (allowlist),
# tag the new main commit, and publish a GitHub Release.
#
# This is THE workflow that ships the kit. It runs on `dev` (the only
# branch that holds workflows — Marketplace publishing prohibits
# workflows on the default branch).
#
# Pipeline:
#   1. dispatch-prechecks (default on) — dispatches the required dev
#                  workflows (`tests.yml`, `self-check.yml`,
#                  `bos-launchpad-code-scan.yml`) via
#                  `workflow_dispatch` and waits for them, so
#                  manual release dispatch just works without
#                  pushing a no-op commit when dev HEAD hasn't been
#                  CI'd. Per workflow: skips if the latest dev run
#                  for the current HEAD already succeeded; just
#                  waits (no re-dispatch) if one is queued or
#                  in-progress; otherwise dispatches fresh. Disabled
#                  by `run_prechecks=false` or `skip_preflight=true`.
#   2. preflight — confirms dev's HEAD passed every required CI
#                  check before we promote. Cheap (one API call);
#                  prevents shipping from a red SHA.
#   3. compute-tag — if `bump` was used (patch/minor/major, default
#                  `patch`), reads the latest `vX.Y.Z` tag and
#                  computes the next one. Otherwise the operator-
#                  supplied `tag_name` passes through unchanged.
#                  Exactly one of {tag_name, bump != none} must be
#                  provided.
#   4. promote   — `./.github/actions/promote` allowlists files
#                  from dev -> main, hard-blocks `.github/workflows/**`,
#                  validates the SemVer tag, tags main with `vX.Y.Z`.
#   5. release   — `gh release create` inline against the new tag.
#
# Trigger: `workflow_dispatch` only (operator types the version OR
# picks a `bump` mode). The promote action validates SemVer itself.
#
# Marketplace listing: once main has `action.yml` + branding + tag,
# https://github.com/marketplace/actions/<slug> goes live.
name: Release · promote dev → main + tag + publish

"on":
  workflow_dispatch:
    inputs:
      tag_name:
        description: >-
          Explicit tag to create on main (SemVer, e.g. `v1.0.0`).
          Leave empty to auto-compute via `bump`.
        required: false
        type: string
        default: ''
      bump:
        description: >-
          Auto-compute the next tag from the latest `vX.Y.Z` tag.
          Ignored when `tag_name` is non-empty. Defaults to `patch`
          so manual dispatch with no inputs ships the next patch
          release. Pick `none` to force an explicit `tag_name`.
        required: false
        type: choice
        default: 'patch'
        options:
          - patch
          - minor
          - major
          - none
      release_name:
        description: 'Release title (defaults to the resolved tag).'
        required: false
        type: string
        default: ''
      dry_run:
        description: 'Validate + stage diff but do not push or tag.'
        required: false
        type: boolean
        default: false
      release_draft:
        description: 'Create the GitHub Release as draft.'
        required: false
        type: boolean
        default: false
      update_major_tag:
        description: >-
          Move (force-push) the floating major tag (e.g. `v1`) to
          point at the new release. Standard Marketplace convention.
        required: false
        type: boolean
        default: true
      skip_preflight:
        description: >-
          Ship from a red dev SHA. Off by default; flip only when
          the failing check is genuinely irrelevant (e.g. an
          external service outage). Documented in the release notes.
        required: false
        type: boolean
        default: false
      run_prechecks:
        description: >-
          Before the preflight gate, dispatch the required dev
          workflows (tests / self-check / security-scan) and wait
          for them to complete on the current dev HEAD. Per
          workflow, this skips if the latest run on the current SHA
          already succeeded, just waits (no re-dispatch) if one is
          queued or in-progress, and otherwise dispatches a fresh
          run via `workflow_dispatch`. Defaults to `true` so manual
          release dispatch can ship from a CI-cold dev HEAD without
          first pushing a no-op commit. Set `false` when you have
          already pushed and just want the cheap preflight API
          check. Ignored when `skip_preflight=true`.
        required: false
        type: boolean
        default: true

permissions:
  contents: read

# Group on workflow name (one release at a time globally), not on
# tag_name — tag_name can be empty when `bump` is used and we need
# the concurrency lock to bind regardless.
concurrency:
  group: release-${{ github.workflow }}
  cancel-in-progress: false

jobs:
  # ---------------------------------------------------------------------------
  # Preflight — validate `vars.DEFAULT_RUNNER` once before any downstream job
  # evaluates its `runs-on:` expression. Fails fast with a clear annotation
  # when the variable is missing or malformed, instead of leaving jobs
  # queued indefinitely against an unmatched label. Runs on `ubuntu-latest`
  # because the validator must run on a runner that is always present.
  # See `blackoutsecure/bos-automation-hub` README ("Runner resolution")
  # for the org-wide convention this mirrors.
  # ---------------------------------------------------------------------------
  preflight-runner-config:
    name: Preflight (runner config)
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: blackoutsecure/bos-automation-hub/.github/actions/shared/preflight-runner-config@main
        with:
          default_runner: ${{ vars.DEFAULT_RUNNER }}

  # ---------------------------------------------------------------------------
  # Dispatch the required dev workflows and wait for them, so the operator
  # can fire release directly without first pushing a no-op commit to
  # re-trigger CI. Skipped when `run_prechecks=false` (operator just wants
  # the cheap preflight gate against whatever's already on dev) or when
  # `skip_preflight=true` (no point spending compute to populate checks
  # that the next job is going to ignore anyway).
  #
  # Per workflow the logic is:
  #   * latest run for this SHA already success → skip dispatch
  #   * latest run for this SHA queued/in-progress → wait on it
  #     (re-dispatching would just be canceled by each workflow's own
  #     `concurrency: cancel-in-progress`)
  #   * anything else (failure, never-ran) → dispatch a fresh run via
  #     `workflow_dispatch` and capture its run ID by polling
  #     `gh run list --commit=${DEV_SHA}` filtered to dispatches that
  #     started after our timestamp.
  #
  # Then `gh run watch --exit-status` blocks until each run completes,
  # propagating failure here so `preflight` is skipped (via its `needs`
  # gate) rather than running a doomed gate. Watches happen sequentially
  # but the underlying runs are concurrent on the Actions pool, so the
  # wall-clock cost is bounded by the longest workflow (typically the
  # security scan / CodeQL matrix).
  # ---------------------------------------------------------------------------
  dispatch-prechecks:
    name: Dispatch dev prechecks
    needs: preflight-runner-config
    if: >-
      !cancelled()
      && needs.preflight-runner-config.result == 'success'
      && inputs.run_prechecks
      && !inputs.skip_preflight
    runs-on: ${{ fromJSON(startsWith(vars.DEFAULT_RUNNER, '[') && vars.DEFAULT_RUNNER || format('"{0}"', vars.DEFAULT_RUNNER)) }}
    timeout-minutes: 30
    permissions:
      # `actions: write` lets `gh workflow run` create a
      # `workflow_dispatch` event on the same repo via `GITHUB_TOKEN`.
      # `actions: read` is implied; `gh run list` / `gh run watch`
      # only need read scope.
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: dev
          fetch-depth: 1
          persist-credentials: false
      - id: dispatch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO:     ${{ github.repository }}
          # Workflow FILENAMES (not display names). `gh workflow run`
          # resolves them by path under `.github/workflows/`. Names
          # here are the producers of the bare check-run names the
          # `preflight` gate enforces (see REQUIRED_CHECKS below).
          # If you add a required check, ADD ITS WORKFLOW HERE too.
          PRECHECK_WORKFLOWS: |
            tests.yml
            self-check.yml
            bos-launchpad-code-scan.yml
        run: |
          set -euo pipefail

          DEV_SHA="$(git rev-parse HEAD)"
          echo "Dev HEAD: ${DEV_SHA}"

          # Read workflow list into an array, stripping blanks.
          workflows=()
          while IFS= read -r wf; do
            [ -z "${wf}" ] && continue
            workflows+=("${wf}")
          done <<< "${PRECHECK_WORKFLOWS}"

          # Parallel arrays: i-th workflow -> i-th run id + state.
          # state ∈ {skip, wait, dispatched}. "skip" means already
          # green on this SHA; nothing to wait on.
          run_ids=()
          states=()

          for wf in "${workflows[@]}"; do
            echo "::group::Prepare ${wf}"

            # Find the most recent dev run for THIS SHA (regardless
            # of trigger event). --limit=1 + --commit narrows the
            # query to exactly the runs that matter for preflight.
            existing="$(gh run list \
              --workflow="${wf}" \
              --branch=dev \
              --commit="${DEV_SHA}" \
              --limit=1 \
              --json databaseId,status,conclusion,url 2>/dev/null || echo '[]')"

            count="$(jq 'length' <<< "${existing}")"
            if [ "${count}" -gt 0 ]; then
              status="$(jq -r '.[0].status' <<< "${existing}")"
              conclusion="$(jq -r '.[0].conclusion // empty' <<< "${existing}")"
              rid="$(jq -r '.[0].databaseId' <<< "${existing}")"
              url="$(jq -r '.[0].url' <<< "${existing}")"

              if [ "${conclusion}" = "success" ]; then
                echo "  ✓ already success (run ${rid}) — skipping dispatch"
                echo "    ${url}"
                run_ids+=("")
                states+=("skip")
                echo "::endgroup::"
                continue
              fi
              if [ "${status}" = "in_progress" ] || [ "${status}" = "queued" ] || [ "${status}" = "pending" ] || [ "${status}" = "waiting" ]; then
                echo "  ↻ ${status} (run ${rid}) — waiting, will NOT re-dispatch"
                echo "    ${url}"
                run_ids+=("${rid}")
                states+=("wait")
                echo "::endgroup::"
                continue
              fi
              echo "  ✗ previous run ${rid} concluded '${conclusion:-unknown}' (status=${status}) — dispatching fresh"
            else
              echo "  ⨯ no run found for ${DEV_SHA} — dispatching"
            fi

            # Record the timestamp BEFORE dispatch so the post-
            # dispatch query can filter to the run we just created.
            # GitHub creates the run a few seconds after the API
            # call, so we poll for up to 180s.
            before_iso="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            gh workflow run "${wf}" --ref dev

            rid=""
            for _ in $(seq 1 36); do
              sleep 5
              rid="$(gh run list \
                --workflow="${wf}" \
                --branch=dev \
                --commit="${DEV_SHA}" \
                --event=workflow_dispatch \
                --created=">=${before_iso}" \
                --limit=1 \
                --json databaseId \
                --jq '.[0].databaseId // empty' 2>/dev/null || echo '')"
              if [ -n "${rid}" ]; then
                echo "  → dispatched run ${rid}"
                break
              fi
            done
            if [ -z "${rid}" ]; then
              echo "::error::Could not locate dispatched ${wf} run for ${DEV_SHA} after 180s. Check the Actions tab; the dispatch API may have failed silently, or another commit landed on dev (race)."
              exit 1
            fi
            run_ids+=("${rid}")
            states+=("dispatched")
            echo "::endgroup::"
          done

          # Phase 2: block until every non-skipped run finishes.
          # `gh run watch --exit-status` returns non-zero on a failed
          # run; we tally failures and emit one consolidated error.
          failed=0
          summary_lines=()
          for i in "${!workflows[@]}"; do
            wf="${workflows[$i]}"
            rid="${run_ids[$i]}"
            state="${states[$i]}"
            if [ "${state}" = "skip" ]; then
              summary_lines+=("- \`${wf}\`: ✓ already green on \`${DEV_SHA}\`")
              continue
            fi
            echo "::group::Watch ${wf} (${state}) run ${rid}"
            if gh run watch "${rid}" --exit-status --interval 15; then
              echo "  ✓ ${wf} completed successfully"
              summary_lines+=("- \`${wf}\`: ✓ ${state} run [${rid}](https://github.com/${REPO}/actions/runs/${rid}) succeeded")
            else
              rc=$?
              echo "::error::${wf} run ${rid} failed (gh run watch exit ${rc})"
              summary_lines+=("- \`${wf}\`: ✗ ${state} run [${rid}](https://github.com/${REPO}/actions/runs/${rid}) FAILED")
              failed=$((failed+1))
            fi
            echo "::endgroup::"
          done

          {
            echo "## Dispatch prechecks"
            echo ""
            echo "Dev SHA: \`${DEV_SHA}\`"
            echo ""
            printf '%s\n' "${summary_lines[@]}"
          } >> "${GITHUB_STEP_SUMMARY}"

          if [ "${failed}" -gt 0 ]; then
            echo "::error::${failed} precheck workflow(s) failed on ${DEV_SHA}. Preflight will be skipped; fix the failing run(s) on dev (or push a corrective commit) before re-dispatching release."
            exit 1
          fi

  preflight:
    name: Preflight · dev CI must be green
    # `dispatch-prechecks` is included even though it can be skipped
    # (when `run_prechecks=false` or `skip_preflight=true`). The `if:`
    # below tolerates `result == 'skipped'` so preflight still runs
    # against whatever check-runs already exist on dev HEAD.
    needs: [preflight-runner-config, dispatch-prechecks]
    if: >-
      !cancelled()
      && needs.preflight-runner-config.result == 'success'
      && (needs.dispatch-prechecks.result == 'success'
          || needs.dispatch-prechecks.result == 'skipped')
    # Resolves `vars.DEFAULT_RUNNER` (bare label or JSON-array string).
    # Both presence and shape are enforced by `preflight-runner-config`,
    # so this expression has no fallback — see the hub's README
    # ("Runner resolution") for the full rationale.
    runs-on: ${{ fromJSON(startsWith(vars.DEFAULT_RUNNER, '[') && vars.DEFAULT_RUNNER || format('"{0}"', vars.DEFAULT_RUNNER)) }}
    timeout-minutes: 3
    permissions:
      # `checks: read` for /commits/{sha}/check-runs.
      contents: read
      checks: read
    outputs:
      dev_sha: ${{ steps.gate.outputs.dev_sha }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: dev
          fetch-depth: 1
          persist-credentials: false
      - id: gate
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO:     ${{ github.repository }}
          # The names of the checks that protected branches require
          # on dev. Kept in lockstep with branch-protection-on-dev
          # so a green dev SHA here always matches the protection
          # rule. If you add a required check, add it BOTH to dev's
          # branch protection AND to this list (and vice-versa).
          #
          # NOTE on `scan / Analyze (...)`: those two checks come from
          # `bos-launchpad-code-scan.yml`, which invokes the hub-side
          # reusable workflow via a caller job named `scan`. GitHub
          # prefixes check-run names emitted by a reusable workflow
          # with `<caller-job-name> / <called-job-name>`, so the CodeQL
          # matrix job (`name: Analyze (${{ matrix.language }})` in the
          # hub reusable) surfaces here — and in dev branch protection
          # — as `scan / Analyze (python)` / `scan / Analyze (actions)`,
          # NOT the bare `Analyze (...)` names from the pre-consolidation
          # standalone `codeql.yml` workflow. If you rename the caller
          # job in `bos-launchpad-code-scan.yml`, update these entries
          # AND dev's branch protection in the same change.
          REQUIRED_CHECKS: |
            Python CLI (smoke + pytest)
            scan / Analyze (python)
            scan / Analyze (actions)
            Lint markdown / yaml / shell / actions
            Run check against own action.yml
            Render branding preview
            Verify branch protection on main
          SKIP_PREFLIGHT: ${{ inputs.skip_preflight }}
        run: |
          set -euo pipefail
          DEV_SHA="$(git rev-parse HEAD)"
          echo "dev_sha=${DEV_SHA}" >> "${GITHUB_OUTPUT}"
          echo "Dev HEAD: ${DEV_SHA}"

          if [ "${SKIP_PREFLIGHT}" = "true" ]; then
            echo "::warning::skip_preflight=true -- shipping from ${DEV_SHA} without verifying CI status. Document why in the release notes."
            exit 0
          fi

          # Fetch all check-runs for the SHA. Paginate up to 100.
          RAW="$(gh api \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "repos/${REPO}/commits/${DEV_SHA}/check-runs?per_page=100")"

          # Stash the JSON in a temp file so the Python helper can
          # read it from disk (stdin is reserved for the heredoc body).
          RAW_FILE="$(mktemp)"
          trap 'rm -f "${RAW_FILE}"' EXIT
          printf '%s' "${RAW}" > "${RAW_FILE}"

          fail=0
          missing=0
          while IFS= read -r required; do
            [ -z "${required}" ] && continue
            # Find the check by name; pick the most recent if there
            # are multiple (rerun, matrix, etc.) — we want the last
            # observed conclusion. The Python helper runs from a
            # quoted heredoc so the f-string can use single quotes
            # inside its expressions (Python <3.12 disallows backslashes
            # in f-string braces).
            line="$(REQUIRED_NAME="${required}" RAW_FILE="${RAW_FILE}" python3 <<'PY'
          import json, os
          name = os.environ["REQUIRED_NAME"]
          with open(os.environ["RAW_FILE"], encoding="utf-8") as fh:
              data = json.load(fh)
          runs = [r for r in data.get("check_runs", []) if r.get("name") == name]
          if not runs:
              print("MISSING|||")
              raise SystemExit(0)
          runs.sort(
              key=lambda r: r.get("completed_at") or r.get("started_at") or "",
              reverse=True,
          )
          r = runs[0]
          print(f"{r.get('status','')}|{r.get('conclusion') or ''}|{r.get('html_url','')}")
          PY
          )"
            status="${line%%|*}"
            rest="${line#*|}"
            conclusion="${rest%%|*}"
            url="${rest#*|}"

            if [ "${status}" = "MISSING" ]; then
              echo "::error::Required check '${required}' was NOT run on ${DEV_SHA}. Push a fresh commit to dev to trigger CI, then re-dispatch release."
              missing=$((missing+1))
              continue
            fi
            if [ "${status}" != "completed" ]; then
              echo "::error::Required check '${required}' is ${status} on ${DEV_SHA} (not completed). Wait for CI to finish, then re-dispatch. ${url}"
              fail=$((fail+1))
              continue
            fi
            if [ "${conclusion}" != "success" ]; then
              echo "::error::Required check '${required}' concluded '${conclusion}' on ${DEV_SHA} (must be 'success'). ${url}"
              fail=$((fail+1))
              continue
            fi
            echo "  ✓ ${required}"
          done <<< "${REQUIRED_CHECKS}"

          {
            echo "## Preflight"
            echo ""
            echo "Dev SHA: \`${DEV_SHA}\`"
            echo ""
            if [ $((fail + missing)) -eq 0 ]; then
              echo "All required checks passed."
            else
              echo "**Required checks failing:** ${fail} / **missing:** ${missing}"
            fi
          } >> "${GITHUB_STEP_SUMMARY}"

          if [ $((fail + missing)) -gt 0 ]; then
            echo "::error::Preflight failed: ${fail} required check(s) not success, ${missing} not run. Set skip_preflight=true to override (document why in release notes)."
            exit 1
          fi

  compute-tag:
    name: Compute release tag
    needs: [preflight-runner-config, preflight]
    # Resolves `vars.DEFAULT_RUNNER` (bare label or JSON-array string).
    # Both presence and shape are enforced by `preflight-runner-config`,
    # so this expression has no fallback — see the hub's README
    # ("Runner resolution") for the full rationale.
    runs-on: ${{ fromJSON(startsWith(vars.DEFAULT_RUNNER, '[') && vars.DEFAULT_RUNNER || format('"{0}"', vars.DEFAULT_RUNNER)) }}
    timeout-minutes: 2
    permissions:
      contents: read
    outputs:
      tag_name: ${{ steps.compute.outputs.tag_name }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          # Need full tag history to find the latest vX.Y.Z.
          ref: dev
          fetch-depth: 0
          persist-credentials: false
      - id: compute
        env:
          INPUT_TAG_NAME: ${{ inputs.tag_name }}
          INPUT_BUMP:     ${{ inputs.bump }}
        run: |
          set -euo pipefail

          # Trim whitespace.
          TAG="$(printf '%s' "${INPUT_TAG_NAME}" | tr -d '[:space:]')"
          BUMP="${INPUT_BUMP:-none}"

          if [ -n "${TAG}" ] && [ "${BUMP}" != "none" ]; then
            echo "::error::Provide EITHER an explicit tag_name OR a bump mode, not both. Got tag_name='${TAG}' bump='${BUMP}'."
            exit 1
          fi

          if [ -z "${TAG}" ] && [ "${BUMP}" = "none" ]; then
            echo "::error::Either tag_name (explicit) or bump (patch/minor/major) must be provided."
            exit 1
          fi

          if [ -n "${TAG}" ]; then
            echo "Using explicit tag_name: ${TAG}"
          else
            # Find latest vX.Y.Z tag (ignore pre-release suffixes for
            # the seed; the bump produces a clean release tag).
            git fetch --tags --quiet || true
            LATEST="$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' \
              | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' \
              | sort -V \
              | tail -n1 || true)"
            if [ -z "${LATEST}" ]; then
              # First release: bump from v0.0.0.
              LATEST="v0.0.0"
              echo "No prior tags; seeding from v0.0.0."
            else
              echo "Latest tag: ${LATEST}"
            fi
            # Strip leading 'v'.
            VERSION="${LATEST#v}"
            MAJOR="${VERSION%%.*}"
            REST="${VERSION#*.}"
            MINOR="${REST%%.*}"
            PATCH="${REST#*.}"
            case "${BUMP}" in
              patch) PATCH=$((PATCH + 1)) ;;
              minor) MINOR=$((MINOR + 1)); PATCH=0 ;;
              major) MAJOR=$((MAJOR + 1)); MINOR=0; PATCH=0 ;;
              *)     echo "::error::Unknown bump mode '${BUMP}'."; exit 1 ;;
            esac
            TAG="v${MAJOR}.${MINOR}.${PATCH}"
            echo "Computed tag (bump=${BUMP}): ${TAG}"
          fi

          # Refuse to overwrite an existing tag (matches promote
          # composite's own guard but fail fast here for clarity).
          if git rev-parse --verify --quiet "refs/tags/${TAG}" >/dev/null; then
            echo "::error::Tag ${TAG} already exists locally. Pick a fresh tag or delete the old one if intentional."
            exit 1
          fi

          echo "tag_name=${TAG}" >> "${GITHUB_OUTPUT}"
          {
            echo "## Tag resolution"
            echo ""
            echo "| Field      | Value |"
            echo "|------------|-------|"
            echo "| tag_name   | \`${TAG}\` |"
            echo "| bump mode  | \`${BUMP}\` |"
          } >> "${GITHUB_STEP_SUMMARY}"

  promote:
    name: Promote dev -> main
    needs: [preflight-runner-config, preflight, compute-tag]
    # Resolves `vars.DEFAULT_RUNNER` (bare label or JSON-array string).
    # Both presence and shape are enforced by `preflight-runner-config`,
    # so this expression has no fallback — see the hub's README
    # ("Runner resolution") for the full rationale.
    runs-on: ${{ fromJSON(startsWith(vars.DEFAULT_RUNNER, '[') && vars.DEFAULT_RUNNER || format('"{0}"', vars.DEFAULT_RUNNER)) }}
    timeout-minutes: 10
    permissions:
      # Required for the push of the promotion commit + tag.
      contents: write
    outputs:
      target_sha:         ${{ steps.promote.outputs.target_sha }}
      source_sha:         ${{ steps.promote.outputs.source_sha }}
      tag_name:           ${{ steps.promote.outputs.tag_name }}
      promoted:           ${{ steps.promote.outputs.promoted }}
      removed_paths:      ${{ steps.promote.outputs.removed_paths }}
      removed_violations: ${{ steps.promote.outputs.removed_violations }}
      token_kind:         ${{ steps.resolve-token.outputs.token_kind }}
      token_identity:     ${{ steps.resolve-token.outputs.token_identity }}
      funding_status:     ${{ steps.resolve-funding.outputs.status }}
      funding_source:     ${{ steps.resolve-funding.outputs.source }}
      sponsorships_enabled: ${{ steps.check-funding-alignment.outputs.repo_sponsorships_enabled }}
      effective_link_count: ${{ steps.check-funding-alignment.outputs.effective_link_count }}
      alignment_status:   ${{ steps.check-funding-alignment.outputs.alignment_status }}
    steps:
      # -------------------------------------------------------------------
      # Resolve which git credential we'll use for the push to main + tag.
      # See repo README § "Step 5b — Tokens, secrets, and variables" for
      # the operator-facing contract; this block is the runtime enforcer.
      #
      # Decision tree:
      #   secrets.RELEASE_PAT set?
      #     yes -> probe 1: /user             (PAT valid?)
      #            probe 2: repos/{}.permissions.push  (user has push role?)
      #            probe 3: POST /repos/{}/git/blobs   (TOKEN scope has
      #                     Contents:Write? — probe 2 only reflects user
      #                     role, not the token's selected scopes. A
      #                     fine-grained PAT with only Metadata:Read or a
      #                     classic PAT without 'repo' ticked will pass
      #                     probe 2 but fail probe 3 and would 403 on the
      #                     real push.) Created blob is dangling and
      #                     GitHub's git GC reclaims it.
      #            all three OK -> use PAT.
      #     no  -> use GITHUB_TOKEN (per-job, App 15368, github-actions[bot]).
      #
      # Classic PAT scope (when RELEASE_PAT is a classic token):
      #   Required:  'repo' (top-level only — there is no narrower
      #              classic scope that grants ref/tag write).
      #   Forbidden: admin:org, admin:enterprise, workflow, delete_repo,
      #              admin:repo_hook, write:packages — none are used by
      #              the release path and all widen blast radius.
      #   SAML:      classic PATs also need 'Configure SSO → Authorize'
      #              for every SAML-enforced org. SAML failures appear
      #              as 'Resource protected by organization SAML
      #              enforcement' in stderr; the probes below detect
      #              that string and emit a SAML-specific remediation.
      # Fine-grained PAT scope:
      #   Required:  Repository permissions → Contents: Read & Write,
      #              Metadata: Read-only (auto-selected with Contents).
      #   Forbidden: anything else.
      #
      # In either case, if the operator gets it wrong we fail fast HERE
      # with a remediation hint, instead of letting `git push` fail later
      # with a confusing "Permission denied to <user>" message. Silent
      # fallback to GITHUB_TOKEN on a misconfigured PAT would hide
      # operator intent.
      # -------------------------------------------------------------------
      - id: resolve-token
        name: Resolve release token
        env:
          HAS_RELEASE_PAT: ${{ secrets.RELEASE_PAT != '' && 'true' || 'false' }}
          REPO:            ${{ github.repository }}
          # `gh` reads from GH_TOKEN; pick PAT if available, else default.
          GH_TOKEN:        ${{ secrets.RELEASE_PAT || secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          if [ "${HAS_RELEASE_PAT}" != "true" ]; then
            echo "::notice title=Release token::Using default GITHUB_TOKEN (RELEASE_PAT not configured). Identity: github-actions[bot] (App ID 15368), scoped by job permissions.contents=write."
            {
              echo "token_kind=default"
              echo "token_identity=github-actions[bot]"
            } >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          # ----- PAT probe 1: validity (revoked / expired / typo) ------
          if ! identity_json="$(gh api /user 2>&1)"; then
            echo "::error title=RELEASE_PAT invalid::Probe of /user failed. The PAT may be expired, revoked, or malformed."
            printf '%s\n' "${identity_json}" | sed 's/^/  /'
            # Even /user can SAML-fail if the PAT was authorized for the org and
            # then revoked at the org level; surface that distinctly.
            if printf '%s' "${identity_json}" | grep -qi 'SAML'; then
              echo "::error::Remediation: SAML SSO authorization for this PAT was revoked. Re-authorize at https://github.com/settings/tokens (find the PAT, click 'Configure SSO') OR unset the RELEASE_PAT secret to fall back to GITHUB_TOKEN."
            else
              echo "::error::Remediation: regenerate a fine-grained PAT with Contents: Read & Write on ${REPO} and update the RELEASE_PAT secret. Or unset RELEASE_PAT to fall back to GITHUB_TOKEN."
            fi
            exit 1
          fi
          login="$(printf '%s' "${identity_json}" | jq -r '.login // "unknown"')"

          # ----- PAT probe 2: scope (must have push on this repo) ------
          # Note: SAML-enforced orgs return 403 here even for a perfectly-scoped
          # PAT if the PAT itself has never been SSO-authorized for the org.
          # Distinguish that case from a genuinely under-scoped PAT.
          owner="${REPO%/*}"
          if ! perms_json="$(gh api "repos/${REPO}" --jq '.permissions // {}' 2>&1)"; then
            if printf '%s' "${perms_json}" | grep -qi 'SAML'; then
              echo "::error title=RELEASE_PAT not SSO-authorized::Identity '${login}' has a valid PAT but it is NOT authorized for the SAML-enforced '${owner}' organization, so it cannot see ${REPO}."
              printf '%s\n' "${perms_json}" | sed 's/^/  /'
              echo "::error::Remediation A (keep PAT path): visit https://github.com/orgs/${owner}/sso, click 'Authorize' for the PAT named in RELEASE_PAT. The PAT must also be configured at https://github.com/settings/tokens with 'Configure SSO' → '${owner}'. Then re-run."
              echo "::error::Remediation B (drop PAT path): delete the RELEASE_PAT secret in repo Settings → Secrets and variables → Actions. The workflow will fall back to GITHUB_TOKEN (github-actions[bot], App 15368), which works whenever main branch protection does not require a PR."
            else
              echo "::error title=RELEASE_PAT lacks repo access::Identity '${login}' cannot read ${REPO}."
              printf '%s\n' "${perms_json}" | sed 's/^/  /'
              echo "::error::Remediation: ensure the PAT grants Metadata: Read-only AND Contents: Read & Write on ${REPO}. Or unset RELEASE_PAT to fall back to GITHUB_TOKEN."
            fi
            exit 1
          fi
          push_perm="$(printf '%s' "${perms_json}" | jq -r '.push // false')"
          if [ "${push_perm}" != "true" ]; then
            echo "::error title=RELEASE_PAT under-scoped::Identity '${login}' lacks push permission on ${REPO}."
            echo "::error::Got permissions: ${perms_json}"
            echo "::error::Remediation: grant Contents: Read & Write (fine-grained) or 'repo' (classic) and re-save the RELEASE_PAT secret. Or unset RELEASE_PAT to fall back to GITHUB_TOKEN."
            exit 1
          fi

          # ----- PAT probe 3: actual Contents:Write capability ---------
          # The probe above reports the AUTHENTICATED USER'S role on the
          # repo, not the PAT's scope. A fine-grained PAT with only
          # Metadata:Read-only selected for the user '${login}' will pass
          # probe 2 (because '${login}' the user has push) yet still 403
          # at git push time (because the TOKEN doesn't grant write).
          #
          # `POST /repos/{}/git/blobs` requires exactly Contents:Write
          # (per GitHub fine-grained PAT permissions matrix). The created
          # blob is dangling — not referenced by any tree, commit, or ref
          # — and GitHub's git GC reclaims it. Safe + idempotent + the
          # smallest possible write test.
          if ! blob_resp="$(gh api -X POST "repos/${REPO}/git/blobs" \
              -f content='release-pat-write-probe' \
              -f encoding='utf-8' 2>&1)"; then
            echo "::error title=RELEASE_PAT missing Contents:Write::Identity '${login}' has repo-level push permission, but the PAT token itself does NOT grant Contents: Read & Write on ${REPO}. The probe (create dangling blob) was denied."
            printf '%s\n' "${blob_resp}" | sed 's/^/  /'
            echo "::error::Remediation A: edit the PAT at https://github.com/settings/tokens, add 'Repository permissions \u2192 Contents: Read & Write' (fine-grained) or 'repo' (classic), re-save the RELEASE_PAT secret."
            echo "::error::Remediation B: delete the RELEASE_PAT secret entirely \u2014 the workflow falls back to GITHUB_TOKEN (github-actions[bot], App 15368), which has Contents:Write by default since main branch protection does not require a PR."
            exit 1
          fi
          probe_sha="$(printf '%s' "${blob_resp}" | jq -r '.sha // ""')"
          echo "Write probe OK (created dangling blob ${probe_sha:0:7}, will be garbage-collected)."

          echo "::notice title=Release token::Using RELEASE_PAT. Identity: ${login}. Push permission: confirmed on ${REPO}."
          {
            echo "token_kind=pat"
            echo "token_identity=${login}"
          } >> "${GITHUB_OUTPUT}"

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: dev
          fetch-depth: 0
          persist-credentials: true
          # When RELEASE_PAT is set, checkout writes IT into the local
          # git extraheader; the promote composite's `git push` then
          # carries the PAT's identity. When RELEASE_PAT is absent,
          # the `||` falls through to GITHUB_TOKEN (checkout's own
          # default, made explicit here for clarity).
          token: ${{ secrets.RELEASE_PAT || secrets.GITHUB_TOKEN }}

      # -------------------------------------------------------------------
      # Resolve FUNDING.yml strategy.
      #
      # The `extra_allowlist_paths` block below conditionally includes
      # `.github/FUNDING.yml` based on this step's `include_in_allowlist`
      # output. The promote composite is generic — it has no knowledge of
      # GitHub's default-community-health-files inheritance semantics —
      # so deciding "is this path missing for a good reason?" lives here.
      #
      # Resolution (driven by `vars.BOS_FUNDING_ENABLED`, default `true`):
      #
      #   disabled              -> skip path; one notice; no probes.
      #   per-repo on dev       -> include path; promotes the override.
      #   org inheritance OK    -> skip path; emit ::notice:: confirming
      #                            source; no spurious "not found" from
      #                            promote.
      #   anything else         -> skip path; emit ::warning:: with the
      #                            specific failure mode + remediation
      #                            (Sponsor button will be absent).
      #
      # Org default-files inheritance only fires when the org `.github`
      # repo is PUBLIC. Private/internal blocks it. User-owned repos get
      # no inheritance at all (no org -> no org-defaults repo).
      # https://docs.github.com/communities/setting-up-your-project-for-healthy-contributions/creating-a-default-community-health-file
      # -------------------------------------------------------------------
      - id: resolve-funding
        name: Resolve FUNDING.yml strategy
        env:
          OWNER:           ${{ github.repository_owner }}
          REPO:            ${{ github.repository }}
          # Default ON when unset; any non-truthy value disables.
          FUNDING_ENABLED: ${{ vars.BOS_FUNDING_ENABLED == '' && 'true' || vars.BOS_FUNDING_ENABLED }}
          GH_TOKEN:        ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          emit() {
            # emit <include_in_allowlist> <status> <source>
            {
              echo "include_in_allowlist=$1"
              echo "status=$2"
              echo "source=$3"
            } >> "${GITHUB_OUTPUT}"
          }

          is_true() {
            case "${1:-}" in
              true|TRUE|True|1|yes|YES|on|ON) return 0 ;;
              *) return 1 ;;
            esac
          }

          if ! is_true "${FUNDING_ENABLED}"; then
            echo "::notice title=FUNDING::Disabled via vars.BOS_FUNDING_ENABLED. Skipping .github/FUNDING.yml; no Sponsor button will appear on the Marketplace listing or the repo header."
            emit false disabled 'disabled by vars.BOS_FUNDING_ENABLED'
            exit 0
          fi

          # --- Tier 1: per-repo override on dev (highest precedence) ---
          if gh api "repos/${REPO}/contents/.github/FUNDING.yml?ref=dev" >/dev/null 2>&1; then
            echo "::notice title=FUNDING::Per-repo override present on dev (.github/FUNDING.yml). Will be promoted to main; overrides any org default."
            emit true per-repo 'per-repo override (.github/FUNDING.yml on dev)'
            exit 0
          fi

          # --- Tier 2: org-default inheritance ---
          # User-owned repos don't get default-files inheritance at all.
          owner_type="$(gh api "users/${OWNER}" --jq '.type // ""' 2>/dev/null || echo '')"
          if [ "${owner_type}" != "Organization" ]; then
            echo "::warning title=FUNDING::Repo owner '${OWNER}' is a user account, not an organization, so GitHub's default-community-health-files inheritance does not apply. No per-repo .github/FUNDING.yml on dev either. Sponsor button will be absent. Remediation: add .github/FUNDING.yml on dev, OR transfer the repo to an org and create '<org>/.github' with FUNDING.yml, OR set vars.BOS_FUNDING_ENABLED=false to acknowledge and silence."
            emit false user-no-inheritance 'none (user-owned repo, no inheritance available)'
            exit 0
          fi

          # Does the org .github repo exist AND is it visible to GITHUB_TOKEN?
          # GITHUB_TOKEN can read public repos in any org, so a 404 here
          # means the repo either doesn't exist OR is private/internal
          # (which would also disqualify it from inheritance anyway —
          # default-files inheritance is public-only).
          if ! org_dotgithub="$(gh api "repos/${OWNER}/.github" 2>/dev/null)"; then
            echo "::warning title=FUNDING::Org '${OWNER}' has no public .github repository (404 from GITHUB_TOKEN — either missing, or private/internal which also blocks inheritance). Sponsor button will be absent. Remediation: create or flip ${OWNER}/.github to PUBLIC with FUNDING.yml, OR add a per-repo .github/FUNDING.yml on dev, OR set vars.BOS_FUNDING_ENABLED=false."
            emit false no-org-dotgithub 'none (org has no public .github repo)'
            exit 0
          fi

          # Inheritance only fires for PUBLIC org .github repos.
          dotgithub_visibility="$(printf '%s' "${org_dotgithub}" | jq -r '.visibility // (.private | if . then "private" else "public" end)')"
          if [ "${dotgithub_visibility}" != "public" ]; then
            echo "::warning title=FUNDING::${OWNER}/.github exists but is '${dotgithub_visibility}'. GitHub's default-community-health-files inheritance only fires for PUBLIC .github repos, so FUNDING.yml will NOT inherit. Remediation: flip ${OWNER}/.github to public, OR add a per-repo .github/FUNDING.yml on dev, OR set vars.BOS_FUNDING_ENABLED=false."
            emit false org-dotgithub-not-public "none (${OWNER}/.github is ${dotgithub_visibility})"
            exit 0
          fi

          # Locate FUNDING.yml inside the org .github repo (any of the
          # three valid locations GitHub honors).
          found=''
          for candidate in FUNDING.yml .github/FUNDING.yml docs/FUNDING.yml; do
            if gh api "repos/${OWNER}/.github/contents/${candidate}" >/dev/null 2>&1; then
              found="${candidate}"
              break
            fi
          done

          if [ -z "${found}" ]; then
            echo "::warning title=FUNDING::${OWNER}/.github is public but contains no FUNDING.yml (checked: FUNDING.yml, .github/FUNDING.yml, docs/FUNDING.yml). Sponsor button will be absent. Remediation: add FUNDING.yml to ${OWNER}/.github, OR add a per-repo .github/FUNDING.yml on dev, OR set vars.BOS_FUNDING_ENABLED=false."
            emit false org-missing-funding "none (${OWNER}/.github has no FUNDING.yml)"
            exit 0
          fi

          # All checks passed — inheritance is wired up correctly.
          echo "::notice title=FUNDING::Inherited from ${OWNER}/.github (path: ${found}). No per-repo override needed; Sponsor button serves the org default. .github/FUNDING.yml intentionally excluded from extra_allowlist_paths."
          emit false inherited "org default (${OWNER}/.github/${found})"

      # -------------------------------------------------------------------
      # Cross-check FUNDING content against the repo-level Sponsorships
      # feature flag (Settings → Features → Sponsorships).
      #
      # The feature flag controls whether the Sponsor button RENDERS.
      # It is independent of FUNDING.yml content (per-repo or inherited).
      # The two can drift:
      #
      #   - Button ON + zero links rendered  -> "button-empty": visitors
      #     see a Sponsor button that opens an empty modal.
      #   - Button OFF + content present     -> "links-hidden": FUNDING.yml
      #     is wired but no button is shown.
      #
      # GitHub exposes Repository.hasSponsorshipsEnabled and
      # Repository.fundingLinks for READING (GraphQL, default token). The
      # rendered link list is the ground truth — it accounts for malformed
      # YAML, inheritance breakage, and platform-side caching that the
      # resolver's content probes cannot see.
      #
      # There is NO public mutation to flip the feature flag (no REST
      # `PATCH /repos/{}` field, no GraphQL mutation — GitHub keeps it
      # human-gated). This step is detection-only: warn loudly with a
      # one-click Settings URL on misalignment, never fail the release.
      # -------------------------------------------------------------------
      - id: check-funding-alignment
        name: Check Sponsorships feature vs FUNDING content
        env:
          REPO:            ${{ github.repository }}
          FUNDING_STATUS:  ${{ steps.resolve-funding.outputs.status }}
          GH_TOKEN:        ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          emit() {
            # emit <repo_sponsorships_enabled> <effective_link_count> <alignment_status>
            {
              echo "repo_sponsorships_enabled=$1"
              echo "effective_link_count=$2"
              echo "alignment_status=$3"
            } >> "${GITHUB_OUTPUT}"
          }

          # Read the rendered feature flag + effective link list.
          # Treat probe failure as non-fatal (transient API issue).
          owner="${REPO%/*}"
          name="${REPO#*/}"
          # shellcheck disable=SC2016  # $owner/$name below are GraphQL placeholders,
          # resolved by `gh api graphql -f owner=... -f name=...`, not shell vars.
          if ! gql_json="$(gh api graphql \
              -f query='query($owner:String!,$name:String!){repository(owner:$owner,name:$name){hasSponsorshipsEnabled fundingLinks{platform url}}}' \
              -f owner="${owner}" -f name="${name}" 2>&1)"; then
            echo "::notice title=Sponsorships::Could not read repo Sponsorships state (GraphQL probe failed). Skipping alignment check."
            printf '%s\n' "${gql_json}" | sed 's/^/  /'
            emit unknown 0 unknown
            exit 0
          fi

          has_sponsorships="$(printf '%s' "${gql_json}" | jq -r '.data.repository.hasSponsorshipsEnabled // false')"
          link_count="$(printf '%s' "${gql_json}" | jq -r '.data.repository.fundingLinks | length')"

          # Did the resolver intend content to be present?
          case "${FUNDING_STATUS}" in
            per-repo|inherited) content_intended=true ;;
            *)                  content_intended=false ;;
          esac

          settings_url="https://github.com/${REPO}/settings"

          # --- Aligned: button on + serving links ---
          if [ "${has_sponsorships}" = "true" ] && [ "${link_count}" -gt 0 ]; then
            echo "::notice title=Sponsorships::Aligned. Sponsor button is enabled and serves ${link_count} link(s). FUNDING source: ${FUNDING_STATUS}."
            emit true "${link_count}" aligned
            exit 0
          fi

          # --- Aligned-off: button off + no content intended ---
          if [ "${has_sponsorships}" != "true" ] && [ "${content_intended}" != "true" ]; then
            echo "::notice title=Sponsorships::Aligned (off). Sponsor button is disabled and no FUNDING content is intended. Consistent state."
            emit false "${link_count}" aligned-off
            exit 0
          fi

          # --- Misaligned: button-empty (flag on but zero links rendered) ---
          if [ "${has_sponsorships}" = "true" ] && [ "${link_count}" -eq 0 ]; then
            echo "::warning title=Sponsorships::MISALIGNED — button-empty. Repo Sponsorships feature is ON but GitHub renders zero funding links. Visitors see a Sponsor button that opens an empty modal. Funding source resolved as '${FUNDING_STATUS}'. Remediation: (a) fix the FUNDING source (per-repo .github/FUNDING.yml on dev, or org-level <org>/.github/FUNDING.yml — ensure YAML is valid); OR (b) untick Settings → Features → Sponsorships at ${settings_url}; OR (c) set vars.BOS_FUNDING_ENABLED=false to acknowledge."
            emit true 0 button-empty
            exit 0
          fi

          # --- Misaligned: links-hidden (content present but flag off) ---
          if [ "${has_sponsorships}" != "true" ] && [ "${content_intended}" = "true" ]; then
            echo "::warning title=Sponsorships::MISALIGNED — links-hidden. FUNDING content is present (source: ${FUNDING_STATUS}, ${link_count} link(s) would be served) but the repo Sponsorships feature is OFF, so no Sponsor button is rendered. Remediation: tick Settings → Features → Sponsorships at ${settings_url} (one-time, human-only — there is no API to flip this)."
            emit false "${link_count}" links-hidden
            exit 0
          fi

          # Catch-all (should be unreachable given the four cases above).
          echo "::notice title=Sponsorships::Indeterminate state: hasSponsorshipsEnabled=${has_sponsorships}, link_count=${link_count}, funding_status=${FUNDING_STATUS}."
          emit "${has_sponsorships}" "${link_count}" indeterminate

      - id: promote
        uses: ./.github/actions/promote
        with:
          source_branch: dev
          target_branch: main
          update_major_tag: ${{ inputs.update_major_tag }}
          # The Marketplace-facing surface on `main`. Everything else
          # (workflows, tests, scripts, src/, docs/) stays on `dev`.
          #
          # Community-health files (README, CoC, CONTRIBUTING, SECURITY,
          # SUPPORT, FUNDING, ISSUE_TEMPLATE/, PULL_REQUEST_TEMPLATE.md)
          # are fully inherited from the org `.github` repo
          # (`blackoutsecure/.github`) — the kit's own check composite
          # uses `*_source: inherit` for those rules in self-check.yml
          # and the Marketplace listing's community profile resolves
          # each one through the org default, so consumers see a 100%
          # community profile without the kit shipping a duplicate copy.
          #
          # Per-repo (NOT inherited) — must be promoted explicitly:
          #   * LICENSE / NOTICE      — root, attached to Marketplace listing
          #   * .github/CODEOWNERS    — affects PR review-routing on main
          #   * .github/dependabot.yml — Dependabot reads ONLY default branch
          #
          # FUNDING.yml is resolved dynamically by the `resolve-funding`
          # step above. When org inheritance is in effect, the path is
          # EXCLUDED from extra_allowlist_paths (no spurious "not found"
          # notice from promote). When a per-repo override exists on dev,
          # the path is INCLUDED so the override promotes. When funding
          # is disabled (`vars.BOS_FUNDING_ENABLED=false`), the path is
          # excluded entirely.
          # See https://docs.github.com/communities/setting-up-your-project-for-healthy-contributions/creating-a-default-community-health-file
          #
          # Deliberately NOT promoted to main (dev-only):
          #   .editorconfig, .gitattributes, .gitignore, .markdownlint.yaml,
          #   .yamllint.yml, .shellcheckrc — these are dev-loop concerns
          #   (IDE behaviour, merge attrs, build artefacts, in-tree lint
          #   configs). `main` is a Marketplace artefact rebuilt wholesale
          #   by promote — no editing, merging, building, or in-tree
          #   linting happens against it, so shipping them creates the
          #   illusion of an editable branch where there isn't one.
          #   The consumer-facing default lint configs live INSIDE the
          #   `lint` composite at `.github/actions/lint/configs/` (a
          #   path already covered by `allowlist_paths` below) and are
          #   promoted to main alongside the action itself.
          allowlist_paths: |
            action.yml
            LICENSE
            NOTICE
            README.md
            .github/actions/_lib
            .github/actions/check
            .github/actions/guard
            .github/actions/promote
            .github/actions/name-check
            .github/actions/branding-preview
            .github/actions/dist-check
            .github/actions/lint
            .github/actions/branch-protection
          extra_allowlist_paths: |
            .github/CODEOWNERS
            .github/dependabot.yml
            ${{ steps.resolve-funding.outputs.include_in_allowlist == 'true' && '.github/FUNDING.yml' || '' }}
          tag_name:       ${{ needs.compute-tag.outputs.tag_name }}
          commit_message: 'release: ${{ needs.compute-tag.outputs.tag_name }}'
          dry_run:        ${{ inputs.dry_run }}

      - name: Job summary
        if: always()
        env:
          PROMOTED:           ${{ steps.promote.outputs.promoted }}
          SOURCE_SHA:         ${{ steps.promote.outputs.source_sha }}
          TARGET_SHA:         ${{ steps.promote.outputs.target_sha }}
          TAG_NAME:           ${{ steps.promote.outputs.tag_name }}
          DRY_RUN:            ${{ inputs.dry_run }}
          REMOVED_PATHS:      ${{ steps.promote.outputs.removed_paths }}
          REMOVED_VIOLATIONS: ${{ steps.promote.outputs.removed_violations }}
          TOKEN_KIND:         ${{ steps.resolve-token.outputs.token_kind }}
          TOKEN_IDENTITY:     ${{ steps.resolve-token.outputs.token_identity }}
          FUNDING_STATUS:     ${{ steps.resolve-funding.outputs.status }}
          FUNDING_SOURCE:     ${{ steps.resolve-funding.outputs.source }}
          SPONSORSHIPS_ENABLED: ${{ steps.check-funding-alignment.outputs.repo_sponsorships_enabled }}
          LINK_COUNT:         ${{ steps.check-funding-alignment.outputs.effective_link_count }}
          ALIGNMENT_STATUS:   ${{ steps.check-funding-alignment.outputs.alignment_status }}
        run: |
          {
            echo "## Release promote"
            echo ""
            echo "| Field         | Value |"
            echo "|---------------|-------|"
            echo "| Source branch | \`dev\` |"
            echo "| Target branch | \`main\` |"
            echo "| Source SHA    | \`${SOURCE_SHA:-n/a}\` |"
            echo "| Target SHA    | \`${TARGET_SHA:-n/a}\` |"
            echo "| Tag           | \`${TAG_NAME}\` |"
            echo "| Promoted      | \`${PROMOTED}\` |"
            echo "| Dry run       | \`${DRY_RUN}\` |"
            echo "| Auth token    | \`${TOKEN_KIND:-default}\` (\`${TOKEN_IDENTITY:-github-actions[bot]}\`) |"
            echo "| Funding       | \`${FUNDING_STATUS:-unknown}\` — ${FUNDING_SOURCE:-n/a} |"
            echo "| Sponsor button | feature \`${SPONSORSHIPS_ENABLED:-unknown}\`, ${LINK_COUNT:-0} link(s) rendered |"
            echo "| Alignment     | \`${ALIGNMENT_STATUS:-unknown}\` |"
            echo ""
            if [ -n "${REMOVED_VIOLATIONS}" ]; then
              echo "### Marketplace violations stripped"
              echo ""
              echo '```'
              printf '%s\n' "${REMOVED_VIOLATIONS}"
              echo '```'
            fi
          } >> "${GITHUB_STEP_SUMMARY}"

  release:
    name: GitHub Release
    needs: [preflight-runner-config, promote]
    # The promote action always publishes the requested tag on success
    # (either via a new commit on `main`, or by tagging the existing
    # `main` HEAD when the allowlisted source tree was already in sync),
    # so `promoted == 'true'` is the right gate for "tag exists on origin;
    # publish the GitHub Release". The gate only short-circuits this job
    # when `dry_run: true` or when promote itself failed.
    if: ${{ needs.promote.outputs.promoted == 'true' && !inputs.dry_run }}
    # Resolves `vars.DEFAULT_RUNNER` (bare label or JSON-array string).
    # Both presence and shape are enforced by `preflight-runner-config`,
    # so this expression has no fallback — see the hub's README
    # ("Runner resolution") for the full rationale.
    runs-on: ${{ fromJSON(startsWith(vars.DEFAULT_RUNNER, '[') && vars.DEFAULT_RUNNER || format('"{0}"', vars.DEFAULT_RUNNER)) }}
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          # Check out the just-promoted target SHA so any release-notes
          # artifacts read the post-promote tree.
          ref: ${{ needs.promote.outputs.target_sha }}
          persist-credentials: false

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG:      ${{ needs.promote.outputs.tag_name }}
          NAME:     ${{ inputs.release_name }}
          DRAFT:    ${{ inputs.release_draft }}
          TARGET:   ${{ needs.promote.outputs.target_sha }}
        run: |
          set -euo pipefail

          title="${NAME:-${TAG}}"

          # Detect pre-release suffix (vX.Y.Z-rc.1, vX.Y.Z-beta, etc.)
          prerelease_flag=""
          case "${TAG}" in
            *-*) prerelease_flag="--prerelease" ;;
          esac

          draft_flag=""
          case "${DRAFT}" in
            true) draft_flag="--draft" ;;
          esac

          # shellcheck disable=SC2086
          gh release create "${TAG}" \
            --target "${TARGET}" \
            --title "${title}" \
            --generate-notes \
            ${prerelease_flag} ${draft_flag}

          echo "Release created: ${TAG}"
