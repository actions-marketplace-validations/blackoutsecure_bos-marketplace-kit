# Marketplace-compliant release: promote `dev` -> `main` (allowlist),
# tag the new main commit, and publish a GitHub Release.
#
# This is THE workflow that ships the kit. It runs on `dev` (the only
# branch that holds workflows — Marketplace publishing prohibits
# workflows on the default branch).
#
# Pipeline:
#   1. dispatch-prechecks (default on) — dispatches the required dev
#                  workflows (`tests.yml`, `self-check.yml`,
#                  `bos-launchpad-code-scan.yml`) via
#                  `workflow_dispatch` and waits for them, so
#                  manual release dispatch just works without
#                  pushing a no-op commit when dev HEAD hasn't been
#                  CI'd. Per workflow: skips if the latest dev run
#                  for the current HEAD already succeeded; just
#                  waits (no re-dispatch) if one is queued or
#                  in-progress; otherwise dispatches fresh. Disabled
#                  by `run_prechecks=false` or `skip_preflight=true`.
#   2. preflight — confirms dev's HEAD passed every required CI
#                  check before we promote. Cheap (one API call);
#                  prevents shipping from a red SHA.
#   3. compute-tag — if `bump` was used (patch/minor/major, default
#                  `patch`), reads the latest `vX.Y.Z` tag and
#                  computes the next one. Otherwise the operator-
#                  supplied `tag_name` passes through unchanged.
#                  Exactly one of {tag_name, bump != none} must be
#                  provided.
#   4. promote   — `./.github/actions/promote` allowlists files
#                  from dev -> main, hard-blocks `.github/workflows/**`,
#                  validates the SemVer tag, tags main with `vX.Y.Z`.
#   5. release   — `gh release create` inline against the new tag.
#
# Trigger: `workflow_dispatch` only (operator types the version OR
# picks a `bump` mode). The promote action validates SemVer itself.
#
# Marketplace listing: once main has `action.yml` + branding + tag,
# https://github.com/marketplace/actions/<slug> goes live.
name: Release · promote dev → main + tag + publish

"on":
  workflow_dispatch:
    inputs:
      tag_name:
        description: >-
          Explicit tag to create on main (SemVer, e.g. `v1.0.0`).
          Leave empty to auto-compute via `bump`.
        required: false
        type: string
        default: ''
      bump:
        description: >-
          Auto-compute the next tag from the latest `vX.Y.Z` tag.
          Ignored when `tag_name` is non-empty. Defaults to `patch`
          so manual dispatch with no inputs ships the next patch
          release. Pick `none` to force an explicit `tag_name`.
        required: false
        type: choice
        default: 'patch'
        options:
          - patch
          - minor
          - major
          - none
      release_name:
        description: 'Release title (defaults to the resolved tag).'
        required: false
        type: string
        default: ''
      dry_run:
        description: 'Validate + stage diff but do not push or tag.'
        required: false
        type: boolean
        default: false
      release_draft:
        description: 'Create the GitHub Release as draft.'
        required: false
        type: boolean
        default: false
      update_major_tag:
        description: >-
          Move (force-push) the floating major tag (e.g. `v1`) to
          point at the new release. Standard Marketplace convention.
        required: false
        type: boolean
        default: true
      skip_preflight:
        description: >-
          Ship from a red dev SHA. Off by default; flip only when
          the failing check is genuinely irrelevant (e.g. an
          external service outage). Documented in the release notes.
        required: false
        type: boolean
        default: false
      run_prechecks:
        description: >-
          Before the preflight gate, dispatch the required dev
          workflows (tests / self-check / security-scan) and wait
          for them to complete on the current dev HEAD. Per
          workflow, this skips if the latest run on the current SHA
          already succeeded, just waits (no re-dispatch) if one is
          queued or in-progress, and otherwise dispatches a fresh
          run via `workflow_dispatch`. Defaults to `true` so manual
          release dispatch can ship from a CI-cold dev HEAD without
          first pushing a no-op commit. Set `false` when you have
          already pushed and just want the cheap preflight API
          check. Ignored when `skip_preflight=true`.
        required: false
        type: boolean
        default: true

permissions:
  contents: read

# Group on workflow name (one release at a time globally), not on
# tag_name — tag_name can be empty when `bump` is used and we need
# the concurrency lock to bind regardless.
concurrency:
  group: release-${{ github.workflow }}
  cancel-in-progress: false

jobs:
  # ---------------------------------------------------------------------------
  # Preflight — validate `vars.DEFAULT_RUNNER` once before any downstream job
  # evaluates its `runs-on:` expression. Fails fast with a clear annotation
  # when the variable is missing or malformed, instead of leaving jobs
  # queued indefinitely against an unmatched label. Runs on `ubuntu-latest`
  # because the validator must run on a runner that is always present.
  # See `blackoutsecure/bos-automation-hub` README ("Runner resolution")
  # for the org-wide convention this mirrors.
  # ---------------------------------------------------------------------------
  preflight-runner-config:
    name: Preflight (runner config)
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: blackoutsecure/bos-automation-hub/.github/actions/shared/preflight-runner-config@main
        with:
          default_runner: ${{ vars.DEFAULT_RUNNER }}

  # ---------------------------------------------------------------------------
  # Dispatch the required dev workflows and wait for them, so the operator
  # can fire release directly without first pushing a no-op commit to
  # re-trigger CI. Skipped when `run_prechecks=false` (operator just wants
  # the cheap preflight gate against whatever's already on dev) or when
  # `skip_preflight=true` (no point spending compute to populate checks
  # that the next job is going to ignore anyway).
  #
  # Per workflow the logic is:
  #   * latest run for this SHA already success → skip dispatch
  #   * latest run for this SHA queued/in-progress → wait on it
  #     (re-dispatching would just be canceled by each workflow's own
  #     `concurrency: cancel-in-progress`)
  #   * anything else (failure, never-ran) → dispatch a fresh run via
  #     `workflow_dispatch` and capture its run ID by polling
  #     `gh run list --commit=${DEV_SHA}` filtered to dispatches that
  #     started after our timestamp.
  #
  # Then `gh run watch --exit-status` blocks until each run completes,
  # propagating failure here so `preflight` is skipped (via its `needs`
  # gate) rather than running a doomed gate. Watches happen sequentially
  # but the underlying runs are concurrent on the Actions pool, so the
  # wall-clock cost is bounded by the longest workflow (typically the
  # security scan / CodeQL matrix).
  # ---------------------------------------------------------------------------
  dispatch-prechecks:
    name: Dispatch dev prechecks
    needs: preflight-runner-config
    if: >-
      !cancelled()
      && needs.preflight-runner-config.result == 'success'
      && inputs.run_prechecks
      && !inputs.skip_preflight
    runs-on: ${{ fromJSON(startsWith(vars.DEFAULT_RUNNER, '[') && vars.DEFAULT_RUNNER || format('"{0}"', vars.DEFAULT_RUNNER)) }}
    timeout-minutes: 30
    permissions:
      # `actions: write` lets `gh workflow run` create a
      # `workflow_dispatch` event on the same repo via `GITHUB_TOKEN`.
      # `actions: read` is implied; `gh run list` / `gh run watch`
      # only need read scope.
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: dev
          fetch-depth: 1
          persist-credentials: false
      - id: dispatch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO:     ${{ github.repository }}
          # Workflow FILENAMES (not display names). `gh workflow run`
          # resolves them by path under `.github/workflows/`. Names
          # here are the producers of the bare check-run names the
          # `preflight` gate enforces (see REQUIRED_CHECKS below).
          # If you add a required check, ADD ITS WORKFLOW HERE too.
          PRECHECK_WORKFLOWS: |
            tests.yml
            self-check.yml
            bos-launchpad-code-scan.yml
        run: |
          set -euo pipefail

          DEV_SHA="$(git rev-parse HEAD)"
          echo "Dev HEAD: ${DEV_SHA}"

          # Read workflow list into an array, stripping blanks.
          workflows=()
          while IFS= read -r wf; do
            [ -z "${wf}" ] && continue
            workflows+=("${wf}")
          done <<< "${PRECHECK_WORKFLOWS}"

          # Parallel arrays: i-th workflow -> i-th run id + state.
          # state ∈ {skip, wait, dispatched}. "skip" means already
          # green on this SHA; nothing to wait on.
          run_ids=()
          states=()

          for wf in "${workflows[@]}"; do
            echo "::group::Prepare ${wf}"

            # Find the most recent dev run for THIS SHA (regardless
            # of trigger event). --limit=1 + --commit narrows the
            # query to exactly the runs that matter for preflight.
            existing="$(gh run list \
              --workflow="${wf}" \
              --branch=dev \
              --commit="${DEV_SHA}" \
              --limit=1 \
              --json databaseId,status,conclusion,url 2>/dev/null || echo '[]')"

            count="$(jq 'length' <<< "${existing}")"
            if [ "${count}" -gt 0 ]; then
              status="$(jq -r '.[0].status' <<< "${existing}")"
              conclusion="$(jq -r '.[0].conclusion // empty' <<< "${existing}")"
              rid="$(jq -r '.[0].databaseId' <<< "${existing}")"
              url="$(jq -r '.[0].url' <<< "${existing}")"

              if [ "${conclusion}" = "success" ]; then
                echo "  ✓ already success (run ${rid}) — skipping dispatch"
                echo "    ${url}"
                run_ids+=("")
                states+=("skip")
                echo "::endgroup::"
                continue
              fi
              if [ "${status}" = "in_progress" ] || [ "${status}" = "queued" ] || [ "${status}" = "pending" ] || [ "${status}" = "waiting" ]; then
                echo "  ↻ ${status} (run ${rid}) — waiting, will NOT re-dispatch"
                echo "    ${url}"
                run_ids+=("${rid}")
                states+=("wait")
                echo "::endgroup::"
                continue
              fi
              echo "  ✗ previous run ${rid} concluded '${conclusion:-unknown}' (status=${status}) — dispatching fresh"
            else
              echo "  ⨯ no run found for ${DEV_SHA} — dispatching"
            fi

            # Record the timestamp BEFORE dispatch so the post-
            # dispatch query can filter to the run we just created.
            # GitHub creates the run a few seconds after the API
            # call, so we poll for up to 180s.
            before_iso="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            gh workflow run "${wf}" --ref dev

            rid=""
            for _ in $(seq 1 36); do
              sleep 5
              rid="$(gh run list \
                --workflow="${wf}" \
                --branch=dev \
                --commit="${DEV_SHA}" \
                --event=workflow_dispatch \
                --created=">=${before_iso}" \
                --limit=1 \
                --json databaseId \
                --jq '.[0].databaseId // empty' 2>/dev/null || echo '')"
              if [ -n "${rid}" ]; then
                echo "  → dispatched run ${rid}"
                break
              fi
            done
            if [ -z "${rid}" ]; then
              echo "::error::Could not locate dispatched ${wf} run for ${DEV_SHA} after 180s. Check the Actions tab; the dispatch API may have failed silently, or another commit landed on dev (race)."
              exit 1
            fi
            run_ids+=("${rid}")
            states+=("dispatched")
            echo "::endgroup::"
          done

          # Phase 2: block until every non-skipped run finishes.
          # `gh run watch --exit-status` returns non-zero on a failed
          # run; we tally failures and emit one consolidated error.
          failed=0
          summary_lines=()
          for i in "${!workflows[@]}"; do
            wf="${workflows[$i]}"
            rid="${run_ids[$i]}"
            state="${states[$i]}"
            if [ "${state}" = "skip" ]; then
              summary_lines+=("- \`${wf}\`: ✓ already green on \`${DEV_SHA}\`")
              continue
            fi
            echo "::group::Watch ${wf} (${state}) run ${rid}"
            if gh run watch "${rid}" --exit-status --interval 15; then
              echo "  ✓ ${wf} completed successfully"
              summary_lines+=("- \`${wf}\`: ✓ ${state} run [${rid}](https://github.com/${REPO}/actions/runs/${rid}) succeeded")
            else
              rc=$?
              echo "::error::${wf} run ${rid} failed (gh run watch exit ${rc})"
              summary_lines+=("- \`${wf}\`: ✗ ${state} run [${rid}](https://github.com/${REPO}/actions/runs/${rid}) FAILED")
              failed=$((failed+1))
            fi
            echo "::endgroup::"
          done

          {
            echo "## Dispatch prechecks"
            echo ""
            echo "Dev SHA: \`${DEV_SHA}\`"
            echo ""
            printf '%s\n' "${summary_lines[@]}"
          } >> "${GITHUB_STEP_SUMMARY}"

          if [ "${failed}" -gt 0 ]; then
            echo "::error::${failed} precheck workflow(s) failed on ${DEV_SHA}. Preflight will be skipped; fix the failing run(s) on dev (or push a corrective commit) before re-dispatching release."
            exit 1
          fi

  preflight:
    name: Preflight · dev CI must be green
    # `dispatch-prechecks` is included even though it can be skipped
    # (when `run_prechecks=false` or `skip_preflight=true`). The `if:`
    # below tolerates `result == 'skipped'` so preflight still runs
    # against whatever check-runs already exist on dev HEAD.
    needs: [preflight-runner-config, dispatch-prechecks]
    if: >-
      !cancelled()
      && needs.preflight-runner-config.result == 'success'
      && (needs.dispatch-prechecks.result == 'success'
          || needs.dispatch-prechecks.result == 'skipped')
    # Resolves `vars.DEFAULT_RUNNER` (bare label or JSON-array string).
    # Both presence and shape are enforced by `preflight-runner-config`,
    # so this expression has no fallback — see the hub's README
    # ("Runner resolution") for the full rationale.
    runs-on: ${{ fromJSON(startsWith(vars.DEFAULT_RUNNER, '[') && vars.DEFAULT_RUNNER || format('"{0}"', vars.DEFAULT_RUNNER)) }}
    timeout-minutes: 3
    permissions:
      # `checks: read` for /commits/{sha}/check-runs.
      contents: read
      checks: read
    outputs:
      dev_sha: ${{ steps.gate.outputs.dev_sha }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: dev
          fetch-depth: 1
          persist-credentials: false
      - id: gate
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO:     ${{ github.repository }}
          # The names of the checks that protected branches require
          # on dev. Kept in lockstep with branch-protection-on-dev
          # so a green dev SHA here always matches the protection
          # rule. If you add a required check, add it BOTH to dev's
          # branch protection AND to this list (and vice-versa).
          #
          # NOTE on `scan / Analyze (...)`: those two checks come from
          # `bos-launchpad-code-scan.yml`, which invokes the hub-side
          # reusable workflow via a caller job named `scan`. GitHub
          # prefixes check-run names emitted by a reusable workflow
          # with `<caller-job-name> / <called-job-name>`, so the CodeQL
          # matrix job (`name: Analyze (${{ matrix.language }})` in the
          # hub reusable) surfaces here — and in dev branch protection
          # — as `scan / Analyze (python)` / `scan / Analyze (actions)`,
          # NOT the bare `Analyze (...)` names from the pre-consolidation
          # standalone `codeql.yml` workflow. If you rename the caller
          # job in `bos-launchpad-code-scan.yml`, update these entries
          # AND dev's branch protection in the same change.
          REQUIRED_CHECKS: |
            Python CLI (smoke + pytest)
            scan / Analyze (python)
            scan / Analyze (actions)
            Lint markdown / yaml / shell / actions
            Run check against own action.yml
            Render branding preview
            Verify branch protection on main
          SKIP_PREFLIGHT: ${{ inputs.skip_preflight }}
        run: |
          set -euo pipefail
          DEV_SHA="$(git rev-parse HEAD)"
          echo "dev_sha=${DEV_SHA}" >> "${GITHUB_OUTPUT}"
          echo "Dev HEAD: ${DEV_SHA}"

          if [ "${SKIP_PREFLIGHT}" = "true" ]; then
            echo "::warning::skip_preflight=true -- shipping from ${DEV_SHA} without verifying CI status. Document why in the release notes."
            exit 0
          fi

          # Fetch all check-runs for the SHA. Paginate up to 100.
          RAW="$(gh api \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "repos/${REPO}/commits/${DEV_SHA}/check-runs?per_page=100")"

          # Stash the JSON in a temp file so the Python helper can
          # read it from disk (stdin is reserved for the heredoc body).
          RAW_FILE="$(mktemp)"
          trap 'rm -f "${RAW_FILE}"' EXIT
          printf '%s' "${RAW}" > "${RAW_FILE}"

          fail=0
          missing=0
          while IFS= read -r required; do
            [ -z "${required}" ] && continue
            # Find the check by name; pick the most recent if there
            # are multiple (rerun, matrix, etc.) — we want the last
            # observed conclusion. The Python helper runs from a
            # quoted heredoc so the f-string can use single quotes
            # inside its expressions (Python <3.12 disallows backslashes
            # in f-string braces).
            line="$(REQUIRED_NAME="${required}" RAW_FILE="${RAW_FILE}" python3 <<'PY'
          import json, os
          name = os.environ["REQUIRED_NAME"]
          with open(os.environ["RAW_FILE"], encoding="utf-8") as fh:
              data = json.load(fh)
          runs = [r for r in data.get("check_runs", []) if r.get("name") == name]
          if not runs:
              print("MISSING|||")
              raise SystemExit(0)
          runs.sort(
              key=lambda r: r.get("completed_at") or r.get("started_at") or "",
              reverse=True,
          )
          r = runs[0]
          print(f"{r.get('status','')}|{r.get('conclusion') or ''}|{r.get('html_url','')}")
          PY
          )"
            status="${line%%|*}"
            rest="${line#*|}"
            conclusion="${rest%%|*}"
            url="${rest#*|}"

            if [ "${status}" = "MISSING" ]; then
              echo "::error::Required check '${required}' was NOT run on ${DEV_SHA}. Push a fresh commit to dev to trigger CI, then re-dispatch release."
              missing=$((missing+1))
              continue
            fi
            if [ "${status}" != "completed" ]; then
              echo "::error::Required check '${required}' is ${status} on ${DEV_SHA} (not completed). Wait for CI to finish, then re-dispatch. ${url}"
              fail=$((fail+1))
              continue
            fi
            if [ "${conclusion}" != "success" ]; then
              echo "::error::Required check '${required}' concluded '${conclusion}' on ${DEV_SHA} (must be 'success'). ${url}"
              fail=$((fail+1))
              continue
            fi
            echo "  ✓ ${required}"
          done <<< "${REQUIRED_CHECKS}"

          {
            echo "## Preflight"
            echo ""
            echo "Dev SHA: \`${DEV_SHA}\`"
            echo ""
            if [ $((fail + missing)) -eq 0 ]; then
              echo "All required checks passed."
            else
              echo "**Required checks failing:** ${fail} / **missing:** ${missing}"
            fi
          } >> "${GITHUB_STEP_SUMMARY}"

          if [ $((fail + missing)) -gt 0 ]; then
            echo "::error::Preflight failed: ${fail} required check(s) not success, ${missing} not run. Set skip_preflight=true to override (document why in release notes)."
            exit 1
          fi

  compute-tag:
    name: Compute release tag
    needs: [preflight-runner-config, preflight]
    # Resolves `vars.DEFAULT_RUNNER` (bare label or JSON-array string).
    # Both presence and shape are enforced by `preflight-runner-config`,
    # so this expression has no fallback — see the hub's README
    # ("Runner resolution") for the full rationale.
    runs-on: ${{ fromJSON(startsWith(vars.DEFAULT_RUNNER, '[') && vars.DEFAULT_RUNNER || format('"{0}"', vars.DEFAULT_RUNNER)) }}
    timeout-minutes: 2
    permissions:
      contents: read
    outputs:
      tag_name: ${{ steps.compute.outputs.tag_name }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          # Need full tag history to find the latest vX.Y.Z.
          ref: dev
          fetch-depth: 0
          persist-credentials: false
      - id: compute
        env:
          INPUT_TAG_NAME: ${{ inputs.tag_name }}
          INPUT_BUMP:     ${{ inputs.bump }}
        run: |
          set -euo pipefail

          # Trim whitespace.
          TAG="$(printf '%s' "${INPUT_TAG_NAME}" | tr -d '[:space:]')"
          BUMP="${INPUT_BUMP:-none}"

          if [ -n "${TAG}" ] && [ "${BUMP}" != "none" ]; then
            echo "::error::Provide EITHER an explicit tag_name OR a bump mode, not both. Got tag_name='${TAG}' bump='${BUMP}'."
            exit 1
          fi

          if [ -z "${TAG}" ] && [ "${BUMP}" = "none" ]; then
            echo "::error::Either tag_name (explicit) or bump (patch/minor/major) must be provided."
            exit 1
          fi

          if [ -n "${TAG}" ]; then
            echo "Using explicit tag_name: ${TAG}"
          else
            # Find latest vX.Y.Z tag (ignore pre-release suffixes for
            # the seed; the bump produces a clean release tag).
            git fetch --tags --quiet || true
            LATEST="$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' \
              | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' \
              | sort -V \
              | tail -n1 || true)"
            if [ -z "${LATEST}" ]; then
              # First release: bump from v0.0.0.
              LATEST="v0.0.0"
              echo "No prior tags; seeding from v0.0.0."
            else
              echo "Latest tag: ${LATEST}"
            fi
            # Strip leading 'v'.
            VERSION="${LATEST#v}"
            MAJOR="${VERSION%%.*}"
            REST="${VERSION#*.}"
            MINOR="${REST%%.*}"
            PATCH="${REST#*.}"
            case "${BUMP}" in
              patch) PATCH=$((PATCH + 1)) ;;
              minor) MINOR=$((MINOR + 1)); PATCH=0 ;;
              major) MAJOR=$((MAJOR + 1)); MINOR=0; PATCH=0 ;;
              *)     echo "::error::Unknown bump mode '${BUMP}'."; exit 1 ;;
            esac
            TAG="v${MAJOR}.${MINOR}.${PATCH}"
            echo "Computed tag (bump=${BUMP}): ${TAG}"
          fi

          # Refuse to overwrite an existing tag (matches promote
          # composite's own guard but fail fast here for clarity).
          if git rev-parse --verify --quiet "refs/tags/${TAG}" >/dev/null; then
            echo "::error::Tag ${TAG} already exists locally. Pick a fresh tag or delete the old one if intentional."
            exit 1
          fi

          echo "tag_name=${TAG}" >> "${GITHUB_OUTPUT}"
          {
            echo "## Tag resolution"
            echo ""
            echo "| Field      | Value |"
            echo "|------------|-------|"
            echo "| tag_name   | \`${TAG}\` |"
            echo "| bump mode  | \`${BUMP}\` |"
          } >> "${GITHUB_STEP_SUMMARY}"

  promote:
    name: Promote dev -> main
    needs: [preflight-runner-config, preflight, compute-tag]
    # Resolves `vars.DEFAULT_RUNNER` (bare label or JSON-array string).
    # Both presence and shape are enforced by `preflight-runner-config`,
    # so this expression has no fallback — see the hub's README
    # ("Runner resolution") for the full rationale.
    runs-on: ${{ fromJSON(startsWith(vars.DEFAULT_RUNNER, '[') && vars.DEFAULT_RUNNER || format('"{0}"', vars.DEFAULT_RUNNER)) }}
    timeout-minutes: 10
    permissions:
      # Required for the push of the promotion commit + tag.
      contents: write
    outputs:
      target_sha:         ${{ steps.promote.outputs.target_sha }}
      source_sha:         ${{ steps.promote.outputs.source_sha }}
      tag_name:           ${{ steps.promote.outputs.tag_name }}
      promoted:           ${{ steps.promote.outputs.promoted }}
      removed_paths:      ${{ steps.promote.outputs.removed_paths }}
      removed_violations: ${{ steps.promote.outputs.removed_violations }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: dev
          fetch-depth: 0
          persist-credentials: true

      - id: promote
        uses: ./.github/actions/promote
        with:
          source_branch: dev
          target_branch: main
          update_major_tag: ${{ inputs.update_major_tag }}
          # The Marketplace-facing surface on `main`. Everything else
          # (workflows, tests, scripts, src/, docs/) stays on `dev`.
          #
          # Community-health files (README, CoC, CONTRIBUTING, SECURITY,
          # SUPPORT, FUNDING, ISSUE_TEMPLATE/, PULL_REQUEST_TEMPLATE.md)
          # are fully inherited from the org `.github` repo
          # (`blackoutsecure/.github`) — the kit's own check composite
          # uses `*_source: inherit` for those rules in self-check.yml
          # and the Marketplace listing's community profile resolves
          # each one through the org default, so consumers see a 100%
          # community profile without the kit shipping a duplicate copy.
          #
          # Per-repo (NOT inherited) — must be promoted explicitly:
          #   * LICENSE / NOTICE      — root, attached to Marketplace listing
          #   * .github/CODEOWNERS    — affects PR review-routing on main
          #   * .github/dependabot.yml — Dependabot reads ONLY default branch
          #
          # FUNDING.yml inherits from the org `.github` repo; the
          # `.github/FUNDING.yml` extra below is a no-op unless a
          # per-repo override is intentionally added.
          # See https://docs.github.com/communities/setting-up-your-project-for-healthy-contributions/creating-a-default-community-health-file
          #
          # Deliberately NOT promoted to main (dev-only):
          #   .editorconfig, .gitattributes, .gitignore, .markdownlint.yaml,
          #   .yamllint.yml, .shellcheckrc — these are dev-loop concerns
          #   (IDE behaviour, merge attrs, build artefacts, in-tree lint
          #   configs). `main` is a Marketplace artefact rebuilt wholesale
          #   by promote — no editing, merging, building, or in-tree
          #   linting happens against it, so shipping them creates the
          #   illusion of an editable branch where there isn't one.
          #   Consumers of the `lint` composite read configs from their
          #   own repo, not from the kit's bundled copy.
          allowlist_paths: |
            action.yml
            LICENSE
            NOTICE
            README.md
            .github/actions/_lib
            .github/actions/check
            .github/actions/guard
            .github/actions/promote
            .github/actions/name-check
            .github/actions/branding-preview
            .github/actions/dist-check
            .github/actions/lint
            .github/actions/branch-protection
          extra_allowlist_paths: |
            .github/CODEOWNERS
            .github/dependabot.yml
            .github/FUNDING.yml
          tag_name:       ${{ needs.compute-tag.outputs.tag_name }}
          commit_message: 'release: ${{ needs.compute-tag.outputs.tag_name }}'
          dry_run:        ${{ inputs.dry_run }}

      - name: Job summary
        if: always()
        env:
          PROMOTED:           ${{ steps.promote.outputs.promoted }}
          SOURCE_SHA:         ${{ steps.promote.outputs.source_sha }}
          TARGET_SHA:         ${{ steps.promote.outputs.target_sha }}
          TAG_NAME:           ${{ steps.promote.outputs.tag_name }}
          DRY_RUN:            ${{ inputs.dry_run }}
          REMOVED_PATHS:      ${{ steps.promote.outputs.removed_paths }}
          REMOVED_VIOLATIONS: ${{ steps.promote.outputs.removed_violations }}
        run: |
          {
            echo "## Release promote"
            echo ""
            echo "| Field         | Value |"
            echo "|---------------|-------|"
            echo "| Source branch | \`dev\` |"
            echo "| Target branch | \`main\` |"
            echo "| Source SHA    | \`${SOURCE_SHA:-n/a}\` |"
            echo "| Target SHA    | \`${TARGET_SHA:-n/a}\` |"
            echo "| Tag           | \`${TAG_NAME}\` |"
            echo "| Promoted      | \`${PROMOTED}\` |"
            echo "| Dry run       | \`${DRY_RUN}\` |"
            echo ""
            if [ -n "${REMOVED_VIOLATIONS}" ]; then
              echo "### Marketplace violations stripped"
              echo ""
              echo '```'
              printf '%s\n' "${REMOVED_VIOLATIONS}"
              echo '```'
            fi
          } >> "${GITHUB_STEP_SUMMARY}"

  release:
    name: GitHub Release
    needs: [preflight-runner-config, promote]
    # The promote action always publishes the requested tag on success
    # (either via a new commit on `main`, or by tagging the existing
    # `main` HEAD when the allowlisted source tree was already in sync),
    # so `promoted == 'true'` is the right gate for "tag exists on origin;
    # publish the GitHub Release". The gate only short-circuits this job
    # when `dry_run: true` or when promote itself failed.
    if: ${{ needs.promote.outputs.promoted == 'true' && !inputs.dry_run }}
    # Resolves `vars.DEFAULT_RUNNER` (bare label or JSON-array string).
    # Both presence and shape are enforced by `preflight-runner-config`,
    # so this expression has no fallback — see the hub's README
    # ("Runner resolution") for the full rationale.
    runs-on: ${{ fromJSON(startsWith(vars.DEFAULT_RUNNER, '[') && vars.DEFAULT_RUNNER || format('"{0}"', vars.DEFAULT_RUNNER)) }}
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          # Check out the just-promoted target SHA so any release-notes
          # artifacts read the post-promote tree.
          ref: ${{ needs.promote.outputs.target_sha }}
          persist-credentials: false

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG:      ${{ needs.promote.outputs.tag_name }}
          NAME:     ${{ inputs.release_name }}
          DRAFT:    ${{ inputs.release_draft }}
          TARGET:   ${{ needs.promote.outputs.target_sha }}
        run: |
          set -euo pipefail

          title="${NAME:-${TAG}}"

          # Detect pre-release suffix (vX.Y.Z-rc.1, vX.Y.Z-beta, etc.)
          prerelease_flag=""
          case "${TAG}" in
            *-*) prerelease_flag="--prerelease" ;;
          esac

          draft_flag=""
          case "${DRAFT}" in
            true) draft_flag="--draft" ;;
          esac

          # shellcheck disable=SC2086
          gh release create "${TAG}" \
            --target "${TARGET}" \
            --title "${title}" \
            --generate-notes \
            ${prerelease_flag} ${draft_flag}

          echo "Release created: ${TAG}"
