# Self-dogfood: run the kit's own `check` action against itself.
#
# This is the canonical example of how downstream consumers wire the
# kit. If THIS workflow can't pass against the kit's own action.yml,
# the kit doesn't ship.
#
# Runs on `dev` only — never promoted. Manual `workflow_dispatch` is
# available from the Actions tab for ad-hoc re-runs (e.g. after
# tuning rule severities). `schedule:` is intentionally absent —
# GitHub only fires scheduled workflows from the default branch, and
# Marketplace publishing keeps `.github/workflows/**` off `main`.
name: Self-check · dogfood check + name-check + branding + lint + branch-protection

"on":
  push:
    branches: [dev]
  pull_request:
    branches: [dev]
  workflow_dispatch:
    inputs:
      fail_on_warning:
        description: 'Treat warnings as failures (default true).'
        required: false
        type: boolean
        default: true
      run_name_check:
        description: 'Also run the name-check job (skipped by default on push).'
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: self-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # Preflight — validate `vars.DEFAULT_RUNNER` once before any downstream job
  # evaluates its `runs-on:` expression. Fails fast with a clear annotation
  # when the variable is missing or malformed, instead of leaving jobs
  # queued indefinitely against an unmatched label. Runs on `ubuntu-latest`
  # because the validator must run on a runner that is always present.
  # See `blackoutsecure/bos-automation-hub` README ("Runner resolution")
  # for the org-wide convention this mirrors.
  # ---------------------------------------------------------------------------
  preflight-runner-config:
    name: Preflight (runner config)
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: blackoutsecure/bos-automation-hub/.github/actions/shared/preflight-runner-config@main
        with:
          default_runner: ${{ vars.DEFAULT_RUNNER }}

  check:
    name: Run check against own action.yml
    needs: preflight-runner-config
    # Resolves `vars.DEFAULT_RUNNER` (bare label or JSON-array string).
    # Both presence and shape are enforced by `preflight-runner-config`,
    # so this expression has no fallback — see the hub's README
    # ("Runner resolution") for the full rationale.
    runs-on: ${{ fromJSON(startsWith(vars.DEFAULT_RUNNER, '[') && vars.DEFAULT_RUNNER || format('"{0}"', vars.DEFAULT_RUNNER)) }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - id: check
        uses: ./.github/actions/check
        with:
          action_yml_path: action.yml
          fail_on_warning: ${{ inputs.fail_on_warning || 'true' }}
          # Org-aware community-health lookup. The token is read-only
          # for the org `.github` repo metadata + contents endpoint.
          github_token: ${{ github.token }}
          # `org_health_repo` defaults to `${owner}/.github` when empty.
          #
          # We dogfood the *_source machinery here. The kit no longer
          # ships any of the seven community-health files locally --
          # they all live in `blackoutsecure/.github` and inherit:
          #   - CoC, SECURITY, SUPPORT, FUNDING
          #   - CONTRIBUTING (kit-specific dev-loop / release flow
          #     content has been folded into README.md, which the
          #     org CONTRIBUTING.md explicitly points contributors to)
          #   - issue templates + PR template
          # The single global `community_health_source: inherit`
          # covers all of them; no per-rule overrides needed.
          require_security:        warn
          require_code_of_conduct: warn
          require_contributing:    warn
          require_support:         warn
          require_funding:         warn
          community_health_source: inherit
          # New rule families (v0.2.0+). The kit dogfoods these too.
          # We ship a `.github/dependabot.yml` (DP001 = fail),
          # a CodeQL workflow on dev (CQ001 = fail), and lint configs
          # (.editorconfig, .gitattributes, .gitignore, markdownlint,
          # yamllint -- LT001..LT005 = fail). GHAS toggles are warn
          # (CodeQL on public repos is free; secret scanning + Dependabot
          # alerts default on for public repos). Microsoft Security
          # DevOps + OpenSSF Scorecard are opt-in -- left at skip.
          require_dependabot:           fail
          require_codeql:               fail
          require_editorconfig:         fail
          require_gitattributes:        fail
          require_gitignore:            fail
          require_markdownlint:         fail
          require_yamllint:             fail
          require_ghas_code_scanning:   warn
          require_ghas_secret_scanning: warn
          require_dependabot_alerts:    warn
          require_security_devops:      skip
          require_scorecard:            skip
          # RM### live About-box checks: warn-level (matches kit
          # defaults). The repo IS published with a description and
          # topics via the `repo-metadata` composite on release, so
          # these should pass once a release has happened.
          require_repo_description:     warn
          require_repo_homepage:        warn
          require_repo_topics:          warn
          # MP009 (no workflow files on default branch) is a soft-warn
          # the rule itself flags as 'noisy by design on dev'. The kit
          # IS the canonical case where dev legitimately holds workflows,
          # and the `guard` composite enforces this as a hard fail at
          # promote time anyway -- so skip it here to keep self-check
          # actionable.
          skip_checks: 'MP009'
      - name: Show outputs
        if: always()
        env:
          PASSED:   ${{ steps.check.outputs.passed }}
          FAILED:   ${{ steps.check.outputs.failed }}
          WARNINGS: ${{ steps.check.outputs.warnings }}
        run: |
          set -euo pipefail
          echo "passed=${PASSED}  failed=${FAILED}  warnings=${WARNINGS}"

  name-check:
    name: Verify Marketplace name availability
    needs: preflight-runner-config
    # Resolves `vars.DEFAULT_RUNNER` (bare label or JSON-array string).
    # Both presence and shape are enforced by `preflight-runner-config`,
    # so this expression has no fallback — see the hub's README
    # ("Runner resolution") for the full rationale.
    runs-on: ${{ fromJSON(startsWith(vars.DEFAULT_RUNNER, '[') && vars.DEFAULT_RUNNER || format('"{0}"', vars.DEFAULT_RUNNER)) }}
    timeout-minutes: 5
    # Run on PRs (default) and on manual dispatch when explicitly
    # requested. Skip on plain dev pushes — the external Marketplace
    # search has variable latency and isn't worth the noise.
    if: github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && inputs.run_name_check)
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Extract action name
        id: name
        run: |
          set -euo pipefail
          name="$(python3 -c "import yaml; print(yaml.safe_load(open('action.yml'))['name'])")"
          echo "name=${name}" >> "${GITHUB_OUTPUT}"
          echo "Action name: ${name}"
      - id: nc
        uses: ./.github/actions/name-check
        with:
          proposed_name: ${{ steps.name.outputs.name }}
          # Allow our OWN listing to "collide" with itself post-publish:
          # name-check would otherwise fail every PR after first release.
          fail_on_collision: 'false'
      - name: Surface collisions as warnings
        if: always()
        env:
          USER_OR_ORG: ${{ steps.nc.outputs.user_or_org_collision }}
          MARKETPLACE: ${{ steps.nc.outputs.marketplace_collision }}
          CATEGORY:    ${{ steps.nc.outputs.reserved_category }}
          FEATURE:     ${{ steps.nc.outputs.reserved_feature }}
        run: |
          set -euo pipefail
          # The Marketplace collision becomes EXPECTED after first
          # publish. Surface all four as warnings; humans review.
          for var in USER_OR_ORG MARKETPLACE CATEGORY FEATURE; do
            val="${!var}"
            if [ "${val}" = "true" ]; then
              echo "::warning::name-check: ${var}=true"
            fi
          done

  branding:
    name: Render branding preview
    needs: preflight-runner-config
    # Resolves `vars.DEFAULT_RUNNER` (bare label or JSON-array string).
    # Both presence and shape are enforced by `preflight-runner-config`,
    # so this expression has no fallback — see the hub's README
    # ("Runner resolution") for the full rationale.
    runs-on: ${{ fromJSON(startsWith(vars.DEFAULT_RUNNER, '[') && vars.DEFAULT_RUNNER || format('"{0}"', vars.DEFAULT_RUNNER)) }}
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - id: bp
        uses: ./.github/actions/branding-preview
        with:
          action_yml_path: action.yml
          output_path: ${{ runner.temp }}/branding-preview.svg
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: branding-preview
          path: ${{ steps.bp.outputs.card_path }}
          if-no-files-found: error
          retention-days: 14

  lint:
    name: Lint markdown / yaml / shell / actions
    needs: preflight-runner-config
    # Resolves `vars.DEFAULT_RUNNER` (bare label or JSON-array string).
    # Both presence and shape are enforced by `preflight-runner-config`,
    # so this expression has no fallback — see the hub's README
    # ("Runner resolution") for the full rationale.
    runs-on: ${{ fromJSON(startsWith(vars.DEFAULT_RUNNER, '[') && vars.DEFAULT_RUNNER || format('"{0}"', vars.DEFAULT_RUNNER)) }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - id: lint
        uses: ./.github/actions/lint
        with:
          severity: 'fail'
          # Defaults are fine for the kit -- all four linters on.
      - name: Show outputs
        if: always()
        env:
          ISSUES_TOTAL: ${{ steps.lint.outputs.issues_total }}
        run: |
          set -euo pipefail
          echo "lint issues_total=${ISSUES_TOTAL}"

  branch-protection:
    name: Verify branch protection on main
    needs: preflight-runner-config
    # Resolves `vars.DEFAULT_RUNNER` (bare label or JSON-array string).
    # Both presence and shape are enforced by `preflight-runner-config`,
    # so this expression has no fallback — see the hub's README
    # ("Runner resolution") for the full rationale.
    runs-on: ${{ fromJSON(startsWith(vars.DEFAULT_RUNNER, '[') && vars.DEFAULT_RUNNER || format('"{0}"', vars.DEFAULT_RUNNER)) }}
    timeout-minutes: 3
    # `check` mode is read-only; safe on every PR. NOTE: the GITHUB_TOKEN
    # CANNOT read /branches/{branch}/protection -- the API requires
    # `Administration: read`, which is NOT exposed as a workflow
    # permission scope. The branch-protection composite now downgrades
    # that 403 to a warn in check+warn mode, so this job stays useful
    # for surfacing drift while keeping CI green. To get a real
    # introspection answer here, supply a PAT or App installation
    # token with `Administration: read` via a repo/org secret.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - id: bp
        uses: ./.github/actions/branch-protection
        with:
          github_token: ${{ github.token }}
          mode: 'check'
          # Severity stays warn for the kit -- the kit currently has no
          # protection on main; this surfaces the gap without blocking PRs.
          severity: 'warn'
          branch: 'main'
          bp_require_pull_request: 'true'
          bp_required_approvals: '1'
          bp_no_force_push: 'true'
          bp_no_deletion: 'true'
      - name: Show drift summary
        if: always()
        env:
          COMPLIANT: ${{ steps.bp.outputs.is_compliant }}
          DRIFT:     ${{ steps.bp.outputs.drift_summary }}
        run: |
          set -euo pipefail
          echo "compliant=${COMPLIANT}"
          if [ -n "${DRIFT}" ]; then
            echo "drift:"
            printf '%s\n' "${DRIFT}"
          fi
