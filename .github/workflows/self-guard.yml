# Self-dogfood: run the kit's own `guard` action on every PR
# targeting `main`. Validates that the guard ITSELF doesn't regress
# its own enforcement.
#
# This workflow uses `pull_request_target` (not `pull_request`)
# because workflows MUST live on `dev` (Marketplace publishing
# prohibits workflows on the default branch); a PR-base read on
# `main` would find no workflows. See the guard composite's docstring
# for the security analysis.
#
# Manual `workflow_dispatch` is available from the Actions tab and
# always validates the current `main` tree, regardless of which branch
# the dispatch is triggered from. The guard's purpose is to enforce
# Marketplace publishing constraints on the default branch (`main`),
# so running it against any other ref is meaningless — `dev`
# legitimately holds `.github/workflows/**` and other paths blocked
# on `main`. Under dispatch, `CHECK_PR_DIFF` is `false`; tree-state
# and required-paths checks run against `main`.
#
# `push:` triggers are intentionally absent for the same reason.
# Use the pre-promote hook in `release.yml` (it invokes promote, which
# already runs the same blocked/required-paths logic on the
# allowlisted tree) for the equivalent pre-release check.
#
# `schedule:` is intentionally absent (workflows aren't on `main`,
# which is where GitHub looks for scheduled triggers).
name: Self-guard · dogfood guard on PRs to main

"on":
  pull_request_target:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: self-guard-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  guard:
    name: Marketplace guard
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Resolve checkout ref
        id: ref
        env:
          EVENT_NAME:  ${{ github.event_name }}
          PR_BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          set -euo pipefail
          # PR runs: check out the PR's base branch (always `main` here,
          # since the trigger filters `branches: [main]`).
          # Dispatch runs: always check out `main`. Running the guard
          # against any other ref would always fail by design.
          if [ "${EVENT_NAME}" = "pull_request_target" ] && [ -n "${PR_BASE_REF}" ]; then
            REF="${PR_BASE_REF}"
          else
            REF="main"
          fi
          echo "ref=${REF}" >> "${GITHUB_OUTPUT}"

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ steps.ref.outputs.ref }}
          fetch-depth: 0
          persist-credentials: false

      - id: guard
        uses: ./.github/actions/guard
        with:
          pr_base_sha:    ${{ github.event.pull_request.base.sha }}
          pr_head_sha:    ${{ github.event.pull_request.head.sha }}
          check_pr_diff:  ${{ github.event_name == 'pull_request_target' }}
          check_tree_state: 'true'
          require_action_yml: 'true'
          blocked_paths: |
            .github/workflows/
          required_paths: |
            action.yml
            LICENSE
            README.md
