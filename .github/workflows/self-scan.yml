# Self-scan: run BOS Code Scanning Kit against this repo's dev branch.
#
# Baseline mode uses GITHUB_TOKEN (sufficient for most posture rules).
# Advanced mode uses SCANNING_PAT for secret-scanning/Dependabot posture
# probes that require elevated API permissions.
name: Self-scan

"on":
  push:
    branches: [dev]
  pull_request:
    branches: [dev]
  workflow_dispatch:
    inputs:
      fail_on:
        description: 'Override fail_on (fail|never).'
        required: false
        type: choice
        default: 'never'
        options: ['never', 'fail']
      advanced_scanning:
        description: 'Enable advanced posture probes (PS002/PS003) with SCANNING_PAT.'
        required: false
        type: boolean
        default: false
      require_pat:
        description: 'Fail if advanced scanning is requested but SCANNING_PAT is not set.'
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  security-events: write
  actions: read

concurrency:
  group: self-scan-${{ github.ref }}
  cancel-in-progress: true

jobs:
  preflight-runner-config:
    name: Preflight (runner config)
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: blackoutsecure/bos-automation-hub/.github/actions/shared/preflight-runner-config@main
        with:
          default_runner: ${{ vars.DEFAULT_RUNNER }}

  scan:
    name: Run BOS scan
    needs: preflight-runner-config
    runs-on: ${{ fromJSON(startsWith(vars.DEFAULT_RUNNER, '[') && vars.DEFAULT_RUNNER || format('"{0}"', vars.DEFAULT_RUNNER)) }}
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - id: mode
        name: Resolve scan mode
        env:
          INPUT_ADVANCED: ${{ github.event_name == 'workflow_dispatch' && inputs.advanced_scanning && 'true' || '' }}
          INPUT_REQUIRE_PAT: ${{ github.event_name == 'workflow_dispatch' && inputs.require_pat && 'true' || '' }}
          VAR_ADVANCED: ${{ vars['BOS_SCAN_ADVANCED'] }}
          VAR_REQUIRE_PAT: ${{ vars['BOS_SCAN_REQUIRE_PAT'] }}
          HAS_PAT: ${{ secrets['SCANNING_PAT'] != '' && 'true' || 'false' }}
        run: |
          set -euo pipefail

          is_true() {
            case "${1:-}" in
              true|TRUE|True|1|yes|YES|on|ON) return 0 ;;
              *) return 1 ;;
            esac
          }

          advanced_requested=false
          if [ -n "${INPUT_ADVANCED}" ]; then
            advanced_requested=true
          elif is_true "${VAR_ADVANCED}"; then
            advanced_requested=true
          fi

          require_pat=false
          if [ -n "${INPUT_REQUIRE_PAT}" ]; then
            require_pat=true
          elif is_true "${VAR_REQUIRE_PAT}"; then
            require_pat=true
          fi

          use_pat=false
          if [ "${advanced_requested}" = "true" ] && [ "${HAS_PAT}" = "true" ]; then
            use_pat=true
          fi

          if [ "${advanced_requested}" = "true" ] && [ "${HAS_PAT}" != "true" ] && [ "${require_pat}" = "true" ]; then
            echo "::error::Advanced scanning was requested, but secret SCANNING_PAT is not configured."
            exit 1
          fi

          if [ "${advanced_requested}" = "true" ] && [ "${HAS_PAT}" != "true" ]; then
            echo "::warning::Advanced scanning requested but SCANNING_PAT is missing. Falling back to GITHUB_TOKEN (PS002/PS003 will be skipped)."
          fi

          echo "use_pat=${use_pat}" >> "${GITHUB_OUTPUT}"

      - id: scan
        uses: blackoutsecure/bos-code-scanning-kit@v1
        with:
          github_token: ${{ steps.mode.outputs.use_pat == 'true' && secrets['SCANNING_PAT'] || github.token }}
          enable_posture: 'true'
          enable_scanners: 'true'
          enable_upload: 'true'
          fail_on: ${{ inputs.fail_on || 'never' }}

      - name: Show outputs
        if: always()
        env:
          SARIF_PATH:       ${{ steps.scan.outputs.sarif_path }}
          POSTURE_FAILURES: ${{ steps.scan.outputs.posture_failures }}
        run: |
          set -euo pipefail
          echo "sarif_path=${SARIF_PATH}"
          echo "posture_failures=${POSTURE_FAILURES}"
