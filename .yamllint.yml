# yamllint configuration for blackoutsecure/bos-marketplace-kit.
#
# Optimised for GitHub Actions YAML which uses:
#   * Long inline expressions (${{ ... }}) — line-length relaxed.
#   * Many "on:" / "yes/no" truthy values which yamllint flags by default.
#   * Multi-document files (---) are rare here, so disabled.
#
# Mirror to src/marketplace_kit/data/policies/yamllint.yml when shipped
# as a consumer template.

extends: default

ignore: |
  .git/
  .venv/
  node_modules/
  dist/

rules:
  # GitHub Actions expressions and shell commands routinely exceed 120 cols.
  line-length:
    max: 200
    level: warning

  # GitHub workflows legitimately use the key "on:" which yamllint
  # interprets as a truthy alias. Relax to warning so it doesn't fail.
  truthy:
    allowed-values: ["true", "false", "on", "off", "yes", "no"]
    check-keys: false

  # Permit either flow- or block-style mapping; both appear in workflows.
  braces:
    level: warning

  # Comments don't need to start with a space (some tooling emits "#--").
  comments:
    require-starting-space: false
    min-spaces-from-content: 1

  # Indentation: 2 spaces, but allow sequences to be flush with parent.
  indentation:
    spaces: 2
    indent-sequences: consistent
    check-multi-line-strings: false

  # Allow visually-aligned env: / with: blocks (e.g. column-aligned RHS
  # values), which is a deliberate readability convention across the
  # repo's workflows and composite actions. `max-spaces-before` is left
  # at the default 0 so accidental whitespace-before-colon is still
  # caught.
  colons:
    max-spaces-after: -1

  # Document-start markers (---) are noisy in workflow files.
  document-start: disable
