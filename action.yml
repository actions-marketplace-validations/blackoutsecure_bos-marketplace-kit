name: Blackout Secure Marketplace Kit
description: >-
  Pre-publish validator for GitHub Marketplace Actions. Lints metadata,
  branding, naming, and security defaults.
author: BlackoutSecure

branding:
  icon: check-circle
  color: blue

# This root action is a thin delegate to .github/actions/check.
# The kit's other tools (guard, promote, name-check, branding-preview)
# are accessible at their respective sub-paths under .github/actions/.
#
# Default surface choice rationale: a Marketplace listing for a kit
# should expose ONE thing at its root URL. The lifecycle is:
#
#   1. `check`  — every PR. Static, fast, no auth. (this is root)
#   2. `guard`  — every PR. Diff + tree state, no auth.
#   3. `promote` — on release. Push perms required.
#   4. `name-check`, `branding-preview` — opt-in, situational.

inputs:
  action_yml_path:
    description: 'Path to the action manifest. Default `action.yml`.'
    required: false
    default: 'action.yml'
  fail_on_warning:
    description: '`true` to treat OP### warnings as failures.'
    required: false
    default: 'false'
  skip_checks:
    description: 'Comma-separated check IDs to skip (e.g. `OP003,SC002`).'
    required: false
    default: ''
  workflow_dir:
    description: 'Workflow directory to scan. Set "" to skip.'
    required: false
    default: '.github/workflows'

  # ----- Community-health (CH###) pass-throughs ----------------------------
  # See `.github/actions/check/action.yml` for full semantics. These
  # are forwarded verbatim to the nested check composite so consumers
  # of the root action can configure org-health behaviour without
  # switching to the nested form.

  github_token:
    description: >-
      Token used for org-health API lookups. Defaults to `github.token`;
      set explicitly to use a PAT/fine-grained token with cross-repo
      contents:read.
    required: false
    default: ${{ github.token }}
  org_health_repo:
    description: >-
      `owner/repo` containing fallback community-health files (e.g.
      `blackoutsecure/.github`). Defaults to `${owner}/.github` if
      empty.
    required: false
    default: ''
  check_org_health:
    description: '`true` to enable org-health lookups for CH### rules.'
    required: false
    default: 'true'
  require_security:
    description: "CH001 severity: 'fail', 'warn', or 'skip'."
    required: false
    default: 'warn'
  require_code_of_conduct:
    description: "CH002 severity: 'fail', 'warn', or 'skip'."
    required: false
    default: 'warn'
  require_contributing:
    description: "CH003 severity: 'fail', 'warn', or 'skip'."
    required: false
    default: 'warn'
  require_support:
    description: "CH004 severity: 'fail', 'warn', or 'skip'."
    required: false
    default: 'skip'
  require_issue_templates:
    description: "CH005 severity: 'fail', 'warn', or 'skip'."
    required: false
    default: 'skip'
  require_pr_template:
    description: "CH006 severity: 'fail', 'warn', or 'skip'."
    required: false
    default: 'skip'
  require_funding:
    description: "CH### funding severity: 'fail', 'warn', or 'skip'."
    required: false
    default: 'skip'

  # ----- CH/SC source-mode pass-throughs ----------------------------------
  # Where each community-health file is expected to live:
  #   `local`   -- file must be in this repo (org fallback disabled).
  #   `inherit` -- file must be in the org `.github` repo (local
  #                copy intentionally absent; not consulted).
  #   `either`  -- check local first, fall back to org (default).
  # `community_health_source` is the global default; per-rule
  # overrides take precedence when non-empty.

  community_health_source:
    description: "Global source mode: 'local', 'inherit', or 'either'."
    required: false
    default: 'either'
  security_source:
    description: "SC003 source override (or empty to use global)."
    required: false
    default: ''
  code_of_conduct_source:
    description: "CH001 source override (or empty to use global)."
    required: false
    default: ''
  contributing_source:
    description: "CH002 source override (or empty to use global)."
    required: false
    default: ''
  support_source:
    description: "CH003 source override (or empty to use global)."
    required: false
    default: ''
  issue_templates_source:
    description: "CH004 source override (or empty to use global)."
    required: false
    default: ''
  pr_template_source:
    description: "CH005 source override (or empty to use global)."
    required: false
    default: ''
  funding_source:
    description: "CH006 source override (or empty to use global)."
    required: false
    default: ''

  # ----- AI auto-generation (FUTURE / NOT YET IMPLEMENTED) ----------------
  auto_generate_missing:
    description: >-
      [FUTURE] When `true`, use an LLM to draft missing
      community-health files and open a PR. Stub today; reserved for
      a future release.
    required: false
    default: 'false'

outputs:
  passed:
    description: 'Number of checks that passed.'
    value: ${{ steps.check.outputs.passed }}
  failed:
    description: 'Number of checks that failed.'
    value: ${{ steps.check.outputs.failed }}
  warnings:
    description: 'Number of warnings.'
    value: ${{ steps.check.outputs.warnings }}
  report:
    description: 'Newline-separated `id|status|message` rows.'
    value: ${{ steps.check.outputs.report }}

runs:
  using: composite
  steps:
    - id: check
      uses: ./.github/actions/check
      with:
        action_yml_path:         ${{ inputs.action_yml_path }}
        fail_on_warning:         ${{ inputs.fail_on_warning }}
        skip_checks:             ${{ inputs.skip_checks }}
        workflow_dir:            ${{ inputs.workflow_dir }}
        github_token:            ${{ inputs.github_token }}
        org_health_repo:         ${{ inputs.org_health_repo }}
        check_org_health:        ${{ inputs.check_org_health }}
        require_security:        ${{ inputs.require_security }}
        require_code_of_conduct: ${{ inputs.require_code_of_conduct }}
        require_contributing:    ${{ inputs.require_contributing }}
        require_support:         ${{ inputs.require_support }}
        require_issue_templates: ${{ inputs.require_issue_templates }}
        require_pr_template:     ${{ inputs.require_pr_template }}
        require_funding:         ${{ inputs.require_funding }}
        community_health_source: ${{ inputs.community_health_source }}
        security_source:         ${{ inputs.security_source }}
        code_of_conduct_source:  ${{ inputs.code_of_conduct_source }}
        contributing_source:     ${{ inputs.contributing_source }}
        support_source:          ${{ inputs.support_source }}
        issue_templates_source:  ${{ inputs.issue_templates_source }}
        pr_template_source:      ${{ inputs.pr_template_source }}
        funding_source:          ${{ inputs.funding_source }}
        auto_generate_missing:   ${{ inputs.auto_generate_missing }}
