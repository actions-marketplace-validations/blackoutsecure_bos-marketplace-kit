[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "bos-marketplace-kit"
version = "0.2.0"
description = "Local CLI for the BOS Marketplace Kit — validate, preview, and dry-run Marketplace Action releases without pushing."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{name = "Blackout Secure"}]
keywords = ["github", "actions", "marketplace", "ci", "publishing"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Build Tools",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = [
    "PyYAML>=6.0.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.1.1",
    "pyyaml>=6.0.3",
    "tomli>=2.4.1; python_version < '3.11'",
    "ruff>=0.16.4",
]

[project.scripts]
marketplace-kit = "marketplace_kit.cli:main"

[tool.pytest.ini_options]
# Lets contributors run the suite without `pip install -e .`. CI still
# installs the package editable so the console-script entrypoint
# (`marketplace-kit`) is also exercised end-to-end.
pythonpath = ["src"]
testpaths = ["test"]
addopts = "-ra"

[project.urls]
Homepage = "https://github.com/blackoutsecure/bos-marketplace-kit"
Issues = "https://github.com/blackoutsecure/bos-marketplace-kit/issues"
Source = "https://github.com/blackoutsecure/bos-marketplace-kit"

[tool.ruff]
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4"]
ignore = ["E501"]

[tool.hatch.build.targets.wheel]
packages = ["src/marketplace_kit"]

[tool.hatch.build.targets.wheel.force-include]
"src/marketplace_kit/data/policies" = "marketplace_kit/data/policies"
"src/marketplace_kit/data/marketplace-kit-marketplace-config.json" = "marketplace_kit/data/marketplace-kit-marketplace-config.json"

[tool.hatch.build.targets.sdist]
include = [
    "src/marketplace_kit",
    "README.md",
    "LICENSE",
    "NOTICE",
    "pyproject.toml",
    "test",
]
