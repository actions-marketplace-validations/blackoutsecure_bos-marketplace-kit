# CodeQL static-analysis workflow — GitHub Advanced Security
#
# Generated by `marketplace-kit generate-policy codeql-workflow`.
# Drop at `.github/workflows/codeql.yml`.
#
# Free for public repos. Private repos need a GHAS license.
#
# {{project_name}} maintained by {{owner}}.

name: codeql

"on":
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  schedule:
    # Weekly, Monday 07:00 UTC — outside typical PR-volume windows.
    - cron: '0 7 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  actions: read

concurrency:
  group: codeql-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    # Org-shared runner label; accepts a bare label or a JSON array.
    # Falls back to `ubuntu-latest` when the variable is unset.
    runs-on: ${{ fromJSON(startsWith(vars.DEFAULT_RUNNER || 'ubuntu-latest', '[') && (vars.DEFAULT_RUNNER || 'ubuntu-latest') || format('"{0}"', vars.DEFAULT_RUNNER || 'ubuntu-latest')) }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # Adjust this list to match the languages your repo ships.
        # Supported (as of 2025): cpp, csharp, go, java-kotlin,
        # javascript-typescript, python, ruby, swift, actions.
        language:
          - python
          - actions
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@03e4368ac7daa2bd82b3e85262f3bf87ee112f57 # v3.36.0
        with:
          languages: ${{ matrix.language }}
          queries: security-and-quality

      - name: Autobuild
        uses: github/codeql-action/autobuild@03e4368ac7daa2bd82b3e85262f3bf87ee112f57 # v3.36.0

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@03e4368ac7daa2bd82b3e85262f3bf87ee112f57 # v3.36.0
        with:
          category: '/language:${{ matrix.language }}'
