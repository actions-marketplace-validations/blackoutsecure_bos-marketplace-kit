# Dependabot configuration — automated dependency updates.
#
# Generated by `marketplace-kit generate-policy dependabot`.
# Mirror of the kit's own `.github/dependabot.yml` minus repo-specific
# ecosystems. Add additional `package-ecosystem` blocks for whatever
# your repo actually contains (e.g. `npm`, `docker`, `pip`,
# `terraform`, `gomod`).
#
# Reference:
# https://docs.github.com/en/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file
#
# {{project_name}} maintained by {{owner}}.

version: 2

updates:
  # GitHub Actions — pinned-by-SHA action references are the
  # Marketplace baseline; Dependabot will open PRs to bump them.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "07:00"
      timezone: Etc/UTC
    open-pull-requests-limit: 5
    commit-message:
      prefix: "ci"
      include: scope
    labels:
      - dependencies
      - ci

  # Uncomment + adapt for your language/runtime:
  #
  # - package-ecosystem: npm
  #   directory: /
  #   schedule:
  #     interval: weekly
  #   versioning-strategy: increase
  #
  # - package-ecosystem: pip
  #   directory: /
  #   schedule:
  #     interval: weekly
  #
  # - package-ecosystem: docker
  #   directory: /
  #   schedule:
  #     interval: weekly
