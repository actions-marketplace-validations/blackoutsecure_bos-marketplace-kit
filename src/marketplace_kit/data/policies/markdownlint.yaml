# markdownlint configuration for blackoutsecure/bos-marketplace-kit.
#
# Tuned for a documentation-heavy public Marketplace project where:
#   * READMEs include long URLs and inline code blocks (so MD013 is off).
#   * Headings legitimately repeat across sub-sections (so MD024 allows
#     siblings_only).
#   * GitHub-flavoured admonitions (> [!NOTE]) are valid (so MD028 is off).
#
# The consumer-facing template for new Marketplace Action repos ships
# at src/marketplace_kit/data/policies/markdownlint.yaml — keep changes
# here mirrored unless intentionally diverging.

default: true

# Line length: docs include long URLs and command examples.
MD013: false

# Allow duplicate headings at different depths (e.g. multiple "## Inputs").
MD024:
  siblings_only: true

# GitHub admonition syntax uses blockquote separators that this rule misreads.
MD028: false

# Allow inline HTML (badges, <details>, <kbd> in docs).
MD033: false

# Allow URLs without angle brackets (we use markdown links).
MD034: false

# Don't require first heading to be H1 (release notes templates start at H2).
MD041: false
