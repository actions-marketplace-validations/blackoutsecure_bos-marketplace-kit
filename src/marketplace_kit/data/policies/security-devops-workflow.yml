# Microsoft Security DevOps workflow — Defender for Cloud integration.
#
# Generated by `marketplace-kit generate-policy security-devops-workflow`.
# Drop at `.github/workflows/security-devops.yml`.
#
# The microsoft/security-devops-action wraps a curated set of OSS
# scanners:
#   - Bandit       (Python SAST)
#   - BinSkim      (Windows binary analysis)
#   - ESLint       (JS/TS linting)
#   - Checkov      (IaC scanning: ARM, Bicep, Terraform, k8s, CloudFormation)
#   - Terrascan    (IaC scanning + compliance)
#   - Trivy        (container + filesystem CVE scanning)
#   - Templates    (ARM/Bicep template policy)
#   - PSRule       (Bicep/ARM compliance via PSRule.Rules.Azure)
#
# Useful for repos that ship IaC or container images. Surfaces
# findings in GHAS code-scanning AND (for Azure-connected repos) in
# Microsoft Defender for Cloud.
#
# {{project_name}} maintained by {{owner}}.

name: security-devops

"on":
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  schedule:
    - cron: '15 7 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  actions: read

concurrency:
  group: security-devops-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scan:
    name: Microsoft Security DevOps scan
    # Org-shared runner label; accepts a bare label or a JSON array.
    # Falls back to `ubuntu-latest` when the variable is unset.
    runs-on: ${{ fromJSON(startsWith(vars.DEFAULT_RUNNER || 'ubuntu-latest', '[') && (vars.DEFAULT_RUNNER || 'ubuntu-latest') || format('"{0}"', vars.DEFAULT_RUNNER || 'ubuntu-latest')) }}
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Run analyzers
        id: msdo
        uses: microsoft/security-devops-action@08976cb623803b1b36d7112d4ff9f59eae704de0 # v1.12.0
        with:
          # Comma-separated list of tools, or omit to auto-detect.
          # tools: bandit,eslint,checkov,trivy
          # categories: secrets,code,artifacts,IaC,containers
          # languages: python,javascript

      - name: Upload SARIF
        uses: github/codeql-action/upload-sarif@03e4368ac7daa2bd82b3e85262f3bf87ee112f57 # v3.36.0
        with:
          sarif_file: ${{ steps.msdo.outputs.sarifFile }}
